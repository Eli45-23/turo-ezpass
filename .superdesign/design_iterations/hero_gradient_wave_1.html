<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turo Toll Tracker - Gradient Wave</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Flowbite -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        /* Custom Color Variables */
        :root {
            --space-cadet: #1f2041;
            --english-violet: #4b3f72;
            --sunglow: #ffc857;
            --dark-cyan: #119da4;
            --paynes-gray: #19647e;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif !important;
            margin: 0 !important;
            overflow-x: hidden !important;
        }
        
        .hero-container {
            min-height: 100vh !important;
            background: var(--space-cadet) !important;
            position: relative !important;
            overflow: hidden !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 2rem !important;
        }
        
        .wave-background {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: linear-gradient(135deg, var(--space-cadet) 0%, var(--english-violet) 30%, var(--paynes-gray) 70%, var(--dark-cyan) 100%) !important;
            z-index: 1 !important;
        }
        
        .wave-background::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 150% !important;
            height: 150% !important;
            background: radial-gradient(circle at 20% 20%, var(--sunglow) 0%, transparent 30%),
                        radial-gradient(circle at 80% 80%, var(--dark-cyan) 0%, transparent 30%),
                        radial-gradient(circle at 60% 30%, var(--english-violet) 0%, transparent 40%) !important;
            opacity: 0.3 !important;
            animation: waveFloat 20s ease-in-out infinite !important;
        }
        
        .hero-content {
            position: relative !important;
            z-index: 10 !important;
            text-align: center !important;
            color: white !important;
            max-width: 1200px !important;
            width: 100% !important;
        }
        
        .hero-badge {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            background: rgba(255, 200, 87, 0.15) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 50px !important;
            padding: 0.75rem 1.5rem !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            margin-bottom: 2rem !important;
            color: var(--sunglow) !important;
            animation: slideInDown 0.8s ease-out !important;
        }
        
        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem) !important;
            font-weight: 900 !important;
            line-height: 1.1 !important;
            margin-bottom: 1.5rem !important;
            background: linear-gradient(135deg, white, var(--sunglow), var(--dark-cyan)) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            animation: slideInUp 1s ease-out 0.2s both !important;
        }
        
        .hero-subtitle {
            font-size: clamp(1.25rem, 3vw, 1.75rem) !important;
            margin-bottom: 3rem !important;
            opacity: 0.9 !important;
            max-width: 600px !important;
            margin-left: auto !important;
            margin-right: auto !important;
            line-height: 1.6 !important;
            animation: slideInUp 1s ease-out 0.4s both !important;
        }
        
        .login-card {
            background: linear-gradient(135deg, rgba(75, 63, 114, 0.2), rgba(25, 100, 126, 0.15)) !important;
            backdrop-filter: blur(30px) !important;
            border: 1px solid rgba(255, 200, 87, 0.2) !important;
            border-radius: 24px !important;
            padding: 3rem !important;
            max-width: 450px !important;
            margin: 0 auto 3rem !important;
            box-shadow: 0 25px 50px rgba(31, 32, 65, 0.4) !important;
            animation: scaleIn 0.8s ease-out 0.6s both !important;
        }
        
        .form-title {
            font-size: 2rem !important;
            font-weight: 700 !important;
            margin-bottom: 0.5rem !important;
            color: white !important;
        }
        
        .form-subtitle {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 1rem !important;
            margin-bottom: 2rem !important;
        }
        
        .form-input {
            width: 100% !important;
            padding: 1.25rem 1.5rem !important;
            background: rgba(25, 100, 126, 0.3) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 12px !important;
            color: white !important;
            font-size: 1rem !important;
            margin-bottom: 1.5rem !important;
            transition: all 0.3s ease !important;
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        
        .form-input:focus {
            outline: none !important;
            border-color: var(--sunglow) !important;
            background: rgba(25, 100, 126, 0.4) !important;
            box-shadow: 0 0 20px rgba(255, 200, 87, 0.3) !important;
        }
        
        .signin-btn {
            width: 100% !important;
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f) !important;
            color: var(--space-cadet) !important;
            border: none !important;
            padding: 1.5rem !important;
            border-radius: 12px !important;
            font-size: 1.125rem !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            margin-bottom: 2rem !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
        }
        
        .signin-btn:hover {
            transform: translateY(-3px) !important;
            box-shadow: 0 15px 35px rgba(255, 200, 87, 0.4) !important;
        }
        
        .social-btn {
            background: rgba(17, 157, 164, 0.2) !important;
            border: 1px solid rgba(17, 157, 164, 0.4) !important;
            color: white !important;
            padding: 1rem !important;
            border-radius: 12px !important;
            transition: all 0.3s ease !important;
            margin: 0.5rem !important;
            width: 45% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.5rem !important;
        }
        
        .social-btn:hover {
            background: rgba(17, 157, 164, 0.3) !important;
            border-color: var(--dark-cyan) !important;
        }
        
        .hero-stats {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 2rem !important;
            margin-top: 3rem !important;
            animation: slideInUp 1s ease-out 0.8s both !important;
        }
        
        .stat-item {
            text-align: center !important;
            background: rgba(255, 200, 87, 0.1) !important;
            border: 1px solid rgba(255, 200, 87, 0.2) !important;
            border-radius: 16px !important;
            padding: 1.5rem !important;
            backdrop-filter: blur(10px) !important;
        }
        
        .stat-number {
            font-size: 2.5rem !important;
            font-weight: 900 !important;
            color: var(--sunglow) !important;
            margin-bottom: 0.5rem !important;
        }
        
        .stat-label {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
        }
        
        /* Animations */
        @keyframes waveFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-30px, -30px) rotate(1deg); }
            66% { transform: translate(20px, -20px) rotate(-1deg); }
        }
        
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero-container { padding: 1rem !important; }
            .login-card { padding: 2rem !important; }
            .hero-stats { grid-template-columns: 1fr !important; }
            .social-btn { width: 100% !important; margin: 0.25rem 0 !important; }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="wave-background"></div>
        
        <div class="hero-content">
            <div class="hero-badge">
                <i data-lucide="zap" style="width: 1rem; height: 1rem;"></i>
                Premium Toll Management
            </div>
            
            <h1 class="hero-title">
                DRIVE FORWARD<br>
                TRACK SMART
            </h1>
            
            <p class="hero-subtitle">
                The ultimate toll tracking solution for Turo hosts. Automate everything with AI precision.
            </p>
            
            <div class="login-card">
                <h2 class="form-title">Welcome Back</h2>
                <p class="form-subtitle">Access your command center</p>
                
                <form>
                    <input type="email" class="form-input" placeholder="Email Address" required>
                    <input type="password" class="form-input" placeholder="Password" required>
                    
                    <button type="submit" class="signin-btn">Launch Dashboard</button>
                </form>
                
                <div style="text-align: center; margin: 1.5rem 0; color: rgba(255,255,255,0.7);">
                    or continue with
                </div>
                
                <div style="text-align: center;">
                    <button class="social-btn">
                        <i data-lucide="chrome" style="width: 1rem; height: 1rem;"></i>
                        Google
                    </button>
                    <button class="social-btn">
                        <i data-lucide="square" style="width: 1rem; height: 1rem;"></i>
                        Microsoft
                    </button>
                </div>
            </div>
            
            <div class="hero-stats">
                <div class="stat-item">
                    <div class="stat-number">99.9%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">$5M+</div>
                    <div class="stat-label">Processed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">25K+</div>
                    <div class="stat-label">Users</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
