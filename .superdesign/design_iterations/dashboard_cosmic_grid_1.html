<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turo Toll Tracker - Ethereal Mesh Dashboard</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-cadet: #2D1B69;
            --english-violet: #553C8B;
            --sunglow: #FFC857;
            --dark-cyan: #17A2B8;
            --paynes-gray: #495057;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            background: linear-gradient(135deg, var(--space-cadet) 0%, var(--english-violet) 50%, var(--space-cadet) 100%) !important;
            min-height: 100vh !important;
            color: white !important;
            overflow-x: hidden !important;
            position: relative !important;
        }

        /* Floating Mesh Background */
        .mesh-background {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: -1 !important;
            overflow: hidden !important;
        }

        .floating-shape {
            position: absolute !important;
            border: 2px solid rgba(255, 200, 87, 0.3) !important;
            background: linear-gradient(135deg, rgba(255, 200, 87, 0.1), rgba(23, 162, 184, 0.1)) !important;
            backdrop-filter: blur(10px) !important;
            border-radius: 20% !important;
        }

        .shape-1 {
            width: 120px !important;
            height: 120px !important;
            top: 10% !important;
            left: 15% !important;
            animation: meshFloat1 12s ease-in-out infinite !important;
        }

        .shape-2 {
            width: 80px !important;
            height: 80px !important;
            top: 20% !important;
            right: 20% !important;
            animation: meshFloat2 15s ease-in-out infinite !important;
            border-radius: 50% !important;
        }

        .shape-3 {
            width: 100px !important;
            height: 100px !important;
            bottom: 30% !important;
            left: 10% !important;
            animation: meshFloat3 18s ease-in-out infinite !important;
            transform: rotate(45deg) !important;
        }

        .shape-4 {
            width: 150px !important;
            height: 150px !important;
            bottom: 15% !important;
            right: 15% !important;
            animation: meshFloat4 20s ease-in-out infinite !important;
            border-radius: 30% !important;
        }

        .shape-5 {
            width: 60px !important;
            height: 60px !important;
            top: 60% !important;
            left: 50% !important;
            animation: meshFloat5 10s ease-in-out infinite !important;
            border-radius: 50% !important;
        }

        /* Layout Structure */
        .app-layout {
            display: flex !important;
            min-height: 100vh !important;
            position: relative !important;
            z-index: 10 !important;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px !important;
            background: rgba(255, 255, 255, 0.02) !important;
            backdrop-filter: blur(30px) !important;
            border-right: 1px solid rgba(255, 200, 87, 0.2) !important;
            padding: 2rem 0 !important;
            position: fixed !important;
            height: 100vh !important;
            left: 0 !important;
            top: 0 !important;
            overflow-y: auto !important;
        }

        .sidebar-title {
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            color: var(--sunglow) !important;
            padding: 0 2rem !important;
            margin-bottom: 3rem !important;
            letter-spacing: 1px !important;
        }

        .nav-menu {
            list-style: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .nav-item {
            margin-bottom: 0.5rem !important;
        }

        .nav-link {
            display: flex !important;
            align-items: center !important;
            gap: 1rem !important;
            padding: 1rem 2rem !important;
            color: rgba(255, 255, 255, 0.7) !important;
            text-decoration: none !important;
            transition: all 0.3s ease !important;
            border-left: 3px solid transparent !important;
            font-weight: 500 !important;
        }

        .nav-link:hover {
            color: white !important;
            background: rgba(255, 200, 87, 0.1) !important;
            border-left-color: var(--sunglow) !important;
        }

        .nav-link.active {
            color: var(--sunglow) !important;
            background: rgba(255, 200, 87, 0.15) !important;
            border-left-color: var(--sunglow) !important;
        }

        /* Main Content */
        .main-content {
            flex: 1 !important;
            margin-left: 280px !important;
            position: relative !important;
        }

        /* Dashboard Container */
        .dashboard-container {
            max-width: 1400px !important;
            margin: 0 auto !important;
            padding: 2rem !important;
            position: relative !important;
        }

        /* Header */
        .dashboard-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin-bottom: 3rem !important;
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 20px !important;
            padding: 1.5rem 2rem !important;
            box-shadow: 0 15px 35px rgba(255, 200, 87, 0.1) !important;
        }

        .dashboard-title {
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: 2rem !important;
            font-weight: 700 !important;
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f) !important;
            color: var(--space-cadet) !important;
            border: none !important;
            padding: 1rem 2rem !important;
            border-radius: 12px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
        }

        .upload-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 10px 25px rgba(255, 200, 87, 0.4) !important;
        }

        /* User Profile Avatar */
        .user-profile {
            position: relative !important;
        }

        .user-avatar {
            width: 45px !important;
            height: 45px !important;
            border-radius: 50% !important;
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f) !important;
            color: var(--space-cadet) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-weight: 700 !important;
            font-size: 1.2rem !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            border: 2px solid rgba(255, 200, 87, 0.3) !important;
            box-shadow: 0 5px 15px rgba(255, 200, 87, 0.2) !important;
        }

        .user-avatar:hover {
            transform: translateY(-2px) scale(1.05) !important;
            box-shadow: 0 8px 25px rgba(255, 200, 87, 0.4) !important;
            border-color: var(--sunglow) !important;
        }

        .dropdown-menu {
            position: absolute !important;
            top: 55px !important;
            right: 0 !important;
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(30px) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 12px !important;
            padding: 0.5rem 0 !important;
            min-width: 150px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
            opacity: 0 !important;
            visibility: hidden !important;
            transform: translateY(-10px) !important;
            transition: all 0.3s ease !important;
        }

        .dropdown-menu.show {
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0) !important;
        }

        .dropdown-item {
            display: block !important;
            padding: 0.75rem 1.5rem !important;
            color: rgba(255, 255, 255, 0.8) !important;
            text-decoration: none !important;
            transition: all 0.3s ease !important;
            cursor: pointer !important;
        }

        .dropdown-item:hover {
            background: rgba(255, 200, 87, 0.1) !important;
            color: white !important;
        }

        .header-actions {
            display: flex !important;
            align-items: center !important;
            gap: 1rem !important;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)) !important;
            gap: 2rem !important;
            margin-bottom: 3rem !important;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 20px !important;
            padding: 2rem !important;
            transition: all 0.3s ease !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .stat-card::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            height: 4px !important;
            background: linear-gradient(90deg, var(--sunglow), var(--dark-cyan)) !important;
        }

        .stat-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 20px 40px rgba(255, 200, 87, 0.2) !important;
            border-color: rgba(255, 200, 87, 0.6) !important;
        }

        .stat-number {
            font-size: 3rem !important;
            font-weight: 700 !important;
            color: var(--sunglow) !important;
            margin-bottom: 0.5rem !important;
        }

        .stat-label {
            font-size: 1.1rem !important;
            color: rgba(255, 255, 255, 0.8) !important;
            margin-bottom: 0.5rem !important;
        }

        .stat-value {
            font-size: 0.9rem !important;
            color: rgba(255, 255, 255, 0.6) !important;
        }

        /* Performance Matrix */
        .performance-matrix {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 20px !important;
            padding: 2.5rem !important;
            margin-bottom: 3rem !important;
            position: relative !important;
        }

        .matrix-title {
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: 1.5rem !important;
            font-weight: 600 !important;
            margin-bottom: 2rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 1rem !important;
        }

        .matrix-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)) !important;
            gap: 2rem !important;
        }

        .matrix-item {
            text-align: center !important;
        }

        .matrix-value {
            font-size: 2.5rem !important;
            font-weight: 700 !important;
            color: var(--sunglow) !important;
            margin-bottom: 1rem !important;
        }

        .progress-bar {
            width: 100% !important;
            height: 8px !important;
            background: rgba(255, 255, 255, 0.1) !important;
            border-radius: 10px !important;
            overflow: hidden !important;
            margin-bottom: 0.5rem !important;
        }

        .progress-fill {
            height: 100% !important;
            background: linear-gradient(90deg, var(--sunglow), var(--dark-cyan)) !important;
            border-radius: 10px !important;
            transition: width 1s ease !important;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex !important;
            gap: 1rem !important;
            flex-wrap: wrap !important;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border: 2px solid rgba(255, 200, 87, 0.3) !important;
            padding: 1rem 2rem !important;
            border-radius: 12px !important;
            font-weight: 500 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            backdrop-filter: blur(10px) !important;
        }

        .action-btn:hover {
            background: rgba(255, 200, 87, 0.2) !important;
            border-color: var(--sunglow) !important;
            transform: translateY(-2px) !important;
        }

        /* Animations */
        @keyframes meshFloat1 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            33% { transform: translate(-30px, -30px) rotate(120deg); }
            66% { transform: translate(30px, -20px) rotate(240deg); }
        }

        @keyframes meshFloat2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-40px, 40px) scale(1.1); }
        }

        @keyframes meshFloat3 {
            0%, 100% { transform: rotate(45deg) translate(0px, 0px); }
            25% { transform: rotate(90deg) translate(20px, -30px); }
            75% { transform: rotate(135deg) translate(-25px, 25px); }
        }

        @keyframes meshFloat4 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
            50% { transform: translate(35px, -40px) rotate(180deg) scale(0.9); }
        }

        @keyframes meshFloat5 {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(-20px, -25px); }
            50% { transform: translate(25px, -30px); }
            75% { transform: translate(-15px, 20px); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%) !important;
                transition: transform 0.3s ease !important;
            }
            
            .main-content {
                margin-left: 0 !important;
            }
        }

        @media (max-width: 768px) {
            .dashboard-container { padding: 1rem !important; }
            .dashboard-header { 
                flex-direction: column !important; 
                gap: 1rem !important; 
                text-align: center !important; 
            }
            .header-actions {
                flex-direction: column !important;
                gap: 1rem !important;
            }
            .stats-grid { grid-template-columns: 1fr !important; }
            .matrix-grid { grid-template-columns: 1fr !important; }
            .action-buttons { justify-content: center !important; }
        }
    </style>
</head>
<body>
    <div class="mesh-background">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
        <div class="floating-shape shape-5"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h1 class="sidebar-title">Turo Toll Tracker</h1>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link active">
                            <i data-lucide="bar-chart-3"></i>
                            Overview
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i data-lucide="route"></i>
                            Trips
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i data-lucide="upload"></i>
                            Upload CSV Files
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i data-lucide="activity"></i>
                            Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i data-lucide="radio"></i>
                            Transponders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i data-lucide="file-text"></i>
                            Invoices
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-container">
                <header class="dashboard-header">
                    <h1 class="dashboard-title">Dashboard Overview</h1>
                    <div class="header-actions">
                        <button class="upload-btn">
                            <i data-lucide="upload"></i>
                            Upload CSVs / Run Fetch
                        </button>
                        <div class="user-profile">
                            <div class="user-avatar" onclick="toggleDropdown()">E</div>
                            <div class="dropdown-menu" id="userDropdown">
                                <a href="#" class="dropdown-item" onclick="signOut()">
                                    <i data-lucide="log-out"></i>
                                    Sign Out
                                </a>
                            </div>
                        </div>
                    </div>
                </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">69</div>
                <div class="stat-label">TOTAL TOLLS</div>
                <div class="stat-value">Active tolls</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">50</div>
                <div class="stat-label">PERSONAL DRIVING TOLLS</div>
                <div class="stat-value">$1154.90</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">19</div>
                <div class="stat-label">MATCHED TOLLS</div>
                <div class="stat-value">$87.39</div>
            </div>
        </div>

        <div class="performance-matrix">
            <h2 class="matrix-title">
                <i data-lucide="activity"></i>
                PERFORMANCE MATRIX
            </h2>
            <div class="matrix-grid">
                <div class="matrix-item">
                    <div class="matrix-value">100%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 100%"></div>
                    </div>
                    <div>Matching Accuracy</div>
                </div>
                <div class="matrix-item">
                    <div class="matrix-value">69</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 85%"></div>
                    </div>
                    <div>Total Tolls</div>
                </div>
            </div>
        </div>

                <div class="action-buttons">
                    <button class="action-btn">View Matched (19)</button>
                    <button class="action-btn">Personal Driving (50)</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // User dropdown functionality
        function toggleDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const userProfile = document.querySelector('.user-profile');
            const dropdown = document.getElementById('userDropdown');
            
            if (!userProfile.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        // Sign out functionality
        function signOut() {
            if (confirm('Are you sure you want to sign out?')) {
                // Add your sign out logic here
                window.location.href = '/api/auth/logout';
            }
        }
    </script>
</body>
</html>
