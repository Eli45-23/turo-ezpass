<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turo Toll Tracker - Organic Fluid</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Flowbite -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        /* Custom Color Variables */
        :root {
            --space-cadet: #1f2041;
            --english-violet: #4b3f72;
            --sunglow: #ffc857;
            --dark-cyan: #119da4;
            --paynes-gray: #19647e;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif !important;
            margin: 0 !important;
            overflow-x: hidden !important;
        }
        
        .hero-container {
            min-height: 100vh !important;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(255, 200, 87, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 80%, rgba(17, 157, 164, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 60%, rgba(75, 63, 114, 0.15) 0%, transparent 45%),
                linear-gradient(135deg, var(--space-cadet) 0%, var(--paynes-gray) 50%, var(--english-violet) 100%) !important;
            position: relative !important;
            overflow: hidden !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 2rem !important;
        }
        
        .floating-elements {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            pointer-events: none !important;
            z-index: 1 !important;
        }
        
        .floating-shape {
            position: absolute !important;
            filter: blur(1px) !important;
            animation-timing-function: ease-in-out !important;
            animation-iteration-count: infinite !important;
            animation-direction: alternate !important;
        }
        
        .shape-1 {
            top: 12% !important;
            left: 8% !important;
            width: 120px !important;
            height: 120px !important;
            background: radial-gradient(circle, var(--sunglow) 0%, rgba(255, 200, 87, 0.3) 60%, transparent 100%) !important;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40% !important;
            animation: organicFloat1 12s, morphShape1 8s infinite !important;
        }
        
        .shape-2 {
            top: 25% !important;
            right: 12% !important;
            width: 90px !important;
            height: 150px !important;
            background: radial-gradient(ellipse, var(--dark-cyan) 0%, rgba(17, 157, 164, 0.4) 50%, transparent 100%) !important;
            border-radius: 50% 50% 80% 80% / 60% 60% 40% 40% !important;
            animation: organicFloat2 15s, morphShape2 10s infinite !important;
        }
        
        .shape-3 {
            bottom: 18% !important;
            left: 15% !important;
            width: 80px !important;
            height: 200px !important;
            background: linear-gradient(45deg, var(--english-violet) 0%, rgba(75, 63, 114, 0.5) 70%, transparent 100%) !important;
            border-radius: 40% 60% 60% 40% / 70% 30% 70% 30% !important;
            animation: organicFloat3 18s, morphShape3 12s infinite !important;
        }
        
        .shape-4 {
            bottom: 28% !important;
            right: 10% !important;
            width: 160px !important;
            height: 60px !important;
            background: radial-gradient(ellipse, var(--paynes-gray) 0%, rgba(25, 100, 126, 0.4) 60%, transparent 100%) !important;
            border-radius: 80% 20% 55% 45% / 45% 55% 20% 80% !important;
            animation: organicFloat4 14s, morphShape4 9s infinite !important;
        }
        
        .shape-5 {
            top: 40% !important;
            left: 5% !important;
            width: 100px !important;
            height: 100px !important;
            background: conic-gradient(from 45deg, var(--sunglow) 0%, rgba(255, 200, 87, 0.6) 50%, var(--dark-cyan) 80%, transparent 100%) !important;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70% !important;
            animation: organicFloat5 16s, morphShape5 11s infinite !important;
        }
        
        .shape-6 {
            top: 55% !important;
            right: 18% !important;
            width: 110px !important;
            height: 110px !important;
            background: radial-gradient(circle at 30% 30%, var(--english-violet) 0%, rgba(75, 63, 114, 0.5) 40%, var(--dark-cyan) 70%, transparent 100%) !important;
            border-radius: 60% 40% 80% 20% / 50% 60% 40% 50% !important;
            animation: organicFloat6 20s, morphShape6 13s infinite !important;
        }
        
        .fluid-overlay {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: 
                radial-gradient(circle at 40% 40%, rgba(255, 200, 87, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 80% 20%, rgba(17, 157, 164, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(75, 63, 114, 0.12) 0%, transparent 35%) !important;
            animation: fluidFlow 25s ease-in-out infinite !important;
        }
        
        .hero-content {
            position: relative !important;
            z-index: 10 !important;
            text-align: center !important;
            color: white !important;
            max-width: 1200px !important;
            width: 100% !important;
        }
        
        .hero-badge {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            background: rgba(255, 200, 87, 0.15) !important;
            backdrop-filter: blur(25px) !important;
            border: 1px solid rgba(255, 200, 87, 0.4) !important;
            border-radius: 50px !important;
            padding: 0.75rem 1.5rem !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            margin-bottom: 2rem !important;
            color: var(--sunglow) !important;
            animation: slideInDown 0.8s ease-out, floatingBadge 6s ease-in-out infinite 1s !important;
            box-shadow: 0 8px 32px rgba(255, 200, 87, 0.2) !important;
        }
        
        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem) !important;
            font-weight: 900 !important;
            line-height: 1.1 !important;
            margin-bottom: 1.5rem !important;
            background: linear-gradient(135deg, 
                white 0%, 
                var(--sunglow) 25%, 
                var(--dark-cyan) 50%, 
                var(--english-violet) 75%, 
                white 100%) !important;
            background-size: 200% 200% !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            animation: slideInUp 1s ease-out 0.2s both, fluidGradient 8s ease-in-out infinite !important;
        }
        
        .hero-subtitle {
            font-size: clamp(1.25rem, 3vw, 1.75rem) !important;
            margin-bottom: 3rem !important;
            opacity: 0.9 !important;
            max-width: 600px !important;
            margin-left: auto !important;
            margin-right: auto !important;
            line-height: 1.6 !important;
            animation: slideInUp 1s ease-out 0.4s both !important;
        }
        
        .login-card {
            background: linear-gradient(135deg, 
                rgba(75, 63, 114, 0.25) 0%, 
                rgba(25, 100, 126, 0.2) 50%, 
                rgba(31, 32, 65, 0.3) 100%) !important;
            backdrop-filter: blur(35px) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 32px !important;
            padding: 3rem !important;
            max-width: 450px !important;
            margin: 0 auto 3rem !important;
            box-shadow: 
                0 25px 50px rgba(31, 32, 65, 0.4),
                0 0 100px rgba(255, 200, 87, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
            animation: floatingCard 1s ease-out 0.6s both, cardBreathe 8s ease-in-out infinite 2s !important;
            position: relative !important;
        }
        
        .login-card::before {
            content: '' !important;
            position: absolute !important;
            inset: -1px !important;
            background: linear-gradient(45deg, 
                var(--sunglow) 0%, 
                var(--dark-cyan) 25%, 
                var(--english-violet) 50%, 
                var(--paynes-gray) 75%, 
                var(--sunglow) 100%) !important;
            background-size: 400% 400% !important;
            border-radius: inherit !important;
            z-index: -1 !important;
            opacity: 0.6 !important;
            animation: fluidBorder 12s ease-in-out infinite !important;
        }
        
        .form-title {
            font-size: 2rem !important;
            font-weight: 700 !important;
            margin-bottom: 0.5rem !important;
            color: white !important;
        }
        
        .form-subtitle {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 1rem !important;
            margin-bottom: 2rem !important;
        }
        
        .form-input {
            width: 100% !important;
            padding: 1.25rem 1.5rem !important;
            background: rgba(25, 100, 126, 0.25) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 20px !important;
            color: white !important;
            font-size: 1rem !important;
            margin-bottom: 1.5rem !important;
            transition: all 0.4s ease !important;
            backdrop-filter: blur(10px) !important;
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        
        .form-input:focus {
            outline: none !important;
            border-color: var(--sunglow) !important;
            background: rgba(25, 100, 126, 0.35) !important;
            box-shadow: 0 0 30px rgba(255, 200, 87, 0.3) !important;
            transform: translateY(-3px) !important;
            border-radius: 25px !important;
        }
        
        .signin-btn {
            width: 100% !important;
            background: linear-gradient(135deg, 
                var(--sunglow) 0%, 
                #ffdc7f 50%, 
                var(--sunglow) 100%) !important;
            background-size: 200% 200% !important;
            color: var(--space-cadet) !important;
            border: none !important;
            padding: 1.5rem !important;
            border-radius: 25px !important;
            font-size: 1.125rem !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            transition: all 0.4s ease !important;
            margin-bottom: 2rem !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
            animation: fluidButton 6s ease-in-out infinite !important;
        }
        
        .signin-btn:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 20px 40px rgba(255, 200, 87, 0.5) !important;
            border-radius: 30px !important;
            background-position: 100% 100% !important;
        }
        
        .social-btn {
            background: rgba(17, 157, 164, 0.2) !important;
            border: 1px solid rgba(17, 157, 164, 0.4) !important;
            color: white !important;
            padding: 1rem !important;
            border-radius: 20px !important;
            transition: all 0.4s ease !important;
            margin: 0.5rem !important;
            width: 45% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.5rem !important;
            backdrop-filter: blur(10px) !important;
        }
        
        .social-btn:hover {
            background: rgba(17, 157, 164, 0.3) !important;
            border-color: var(--dark-cyan) !important;
            transform: translateY(-3px) !important;
            border-radius: 25px !important;
        }
        
        .hero-stats {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 2rem !important;
            margin-top: 3rem !important;
            animation: slideInUp 1s ease-out 0.8s both !important;
        }
        
        .stat-item {
            text-align: center !important;
            background: rgba(255, 200, 87, 0.1) !important;
            border: 1px solid rgba(255, 200, 87, 0.25) !important;
            border-radius: 25px !important;
            padding: 1.5rem !important;
            backdrop-filter: blur(15px) !important;
            transition: all 0.4s ease !important;
        }
        
        .stat-item:hover {
            transform: translateY(-8px) !important;
            background: rgba(255, 200, 87, 0.15) !important;
            box-shadow: 0 15px 35px rgba(255, 200, 87, 0.2) !important;
            border-radius: 30px !important;
        }
        
        .stat-number {
            font-size: 2.5rem !important;
            font-weight: 900 !important;
            color: var(--sunglow) !important;
            margin-bottom: 0.5rem !important;
        }
        
        .stat-label {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
        }
        
        /* Organic Animations */
        @keyframes organicFloat1 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(-20px, -30px) rotate(5deg); }
            50% { transform: translate(15px, -45px) rotate(-3deg); }
            75% { transform: translate(-10px, -20px) rotate(7deg); }
        }
        
        @keyframes organicFloat2 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            33% { transform: translate(25px, -35px) rotate(-8deg); }
            66% { transform: translate(-15px, -25px) rotate(5deg); }
        }
        
        @keyframes organicFloat3 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            20% { transform: translate(18px, -28px) rotate(4deg); }
            40% { transform: translate(-12px, -42px) rotate(-6deg); }
            60% { transform: translate(22px, -35px) rotate(8deg); }
            80% { transform: translate(-8px, -15px) rotate(-2deg); }
        }
        
        @keyframes organicFloat4 {
            0%, 100% { transform: translateX(0px) rotate(0deg); }
            50% { transform: translateX(30px) rotate(-5deg); }
        }
        
        @keyframes organicFloat5 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            30% { transform: translate(-25px, -20px) rotate(10deg); }
            60% { transform: translate(20px, -35px) rotate(-7deg); }
        }
        
        @keyframes organicFloat6 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            40% { transform: translate(-30px, 25px) rotate(-12deg); }
            80% { transform: translate(15px, -20px) rotate(6deg); }
        }
        
        @keyframes morphShape1 {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 70% 60% 40% / 40% 70% 30% 60%; }
        }
        
        @keyframes morphShape2 {
            0%, 100% { border-radius: 50% 50% 80% 80% / 60% 60% 40% 40%; }
            50% { border-radius: 80% 20% 50% 50% / 40% 80% 60% 20%; }
        }
        
        @keyframes morphShape3 {
            0%, 100% { border-radius: 40% 60% 60% 40% / 70% 30% 70% 30%; }
            50% { border-radius: 60% 40% 40% 60% / 30% 70% 30% 70%; }
        }
        
        @keyframes morphShape4 {
            0%, 100% { border-radius: 80% 20% 55% 45% / 45% 55% 20% 80%; }
            50% { border-radius: 20% 80% 45% 55% / 80% 20% 55% 45%; }
        }
        
        @keyframes morphShape5 {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
        }
        
        @keyframes morphShape6 {
            0%, 100% { border-radius: 60% 40% 80% 20% / 50% 60% 40% 50%; }
            50% { border-radius: 40% 60% 20% 80% / 60% 40% 50% 50%; }
        }
        
        @keyframes fluidFlow {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }
        
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes floatingBadge {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes fluidGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes floatingCard {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        @keyframes cardBreathe {
            0%, 100% { transform: scale(1) translateY(0px); }
            50% { transform: scale(1.02) translateY(-5px); }
        }
        
        @keyframes fluidBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes fluidButton {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero-container { padding: 1rem !important; }
            .login-card { padding: 2rem !important; }
            .hero-stats { grid-template-columns: 1fr !important; }
            .social-btn { width: 100% !important; margin: 0.25rem 0 !important; }
            .floating-shape { transform: scale(0.7) !important; }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="fluid-overlay"></div>
        <div class="floating-elements">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="floating-shape shape-4"></div>
            <div class="floating-shape shape-5"></div>
            <div class="floating-shape shape-6"></div>
        </div>
        
        <div class="hero-content">
            <div class="hero-badge">
                <i data-lucide="waves" style="width: 1rem; height: 1rem;"></i>
                Fluid Intelligence
            </div>
            
            <h1 class="hero-title">
                FLOW<br>
                FORWARD
            </h1>
            
            <p class="hero-subtitle">
                Organic toll tracking that adapts like water. Experience natural intelligence at work.
            </p>
            
            <div class="login-card">
                <h2 class="form-title">Immerse Yourself</h2>
                <p class="form-subtitle">Dive into your data stream</p>
                
                <form>
                    <input type="email" class="form-input" placeholder="Email Address" required>
                    <input type="password" class="form-input" placeholder="Password" required>
                    
                    <button type="submit" class="signin-btn">Flow Into Dashboard</button>
                </form>
                
                <div style="text-align: center; margin: 1.5rem 0; color: rgba(255,255,255,0.7);">
                    or stream with
                </div>
                
                <div style="text-align: center;">
                    <button class="social-btn">
                        <i data-lucide="chrome" style="width: 1rem; height: 1rem;"></i>
                        Google
                    </button>
                    <button class="social-btn">
                        <i data-lucide="microsoft" style="width: 1rem; height: 1rem;"></i>
                        Microsoft
                    </button>
                </div>
            </div>
            
            <div class="hero-stats">
                <div class="stat-item">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">Flowing</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">∞TB</div>
                    <div class="stat-label">Streamed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">75K+</div>
                    <div class="stat-label">Waves</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
