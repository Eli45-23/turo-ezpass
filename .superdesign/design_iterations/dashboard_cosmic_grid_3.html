<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turo Toll Tracker - Plasma Storm Dashboard</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-cadet: #2D1B69;
            --english-violet: #553C8B;
            --sunglow: #FFC857;
            --dark-cyan: #17A2B8;
            --paynes-gray: #495057;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 200, 87, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(23, 162, 184, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, var(--space-cadet) 0%, var(--english-violet) 50%, #1a0e3d 100%) !important;
            min-height: 100vh !important;
            color: white !important;
            overflow-x: hidden !important;
            position: relative !important;
        }

        /* Plasma Storm Background */
        .plasma-background {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: -1 !important;
            overflow: hidden !important;
        }

        .plasma-bolt {
            position: absolute !important;
            background: linear-gradient(45deg, 
                transparent, 
                rgba(255, 200, 87, 0.3), 
                rgba(23, 162, 184, 0.3), 
                transparent) !important;
            border-radius: 50% !important;
            filter: blur(1px) !important;
        }

        .bolt-1 {
            width: 200px !important;
            height: 4px !important;
            top: 15% !important;
            left: 10% !important;
            transform: rotate(25deg) !important;
            animation: plasmaStrike 3s ease-in-out infinite !important;
        }

        .bolt-2 {
            width: 150px !important;
            height: 3px !important;
            top: 60% !important;
            right: 20% !important;
            transform: rotate(-35deg) !important;
            animation: plasmaStrike 4s ease-in-out infinite 1s !important;
        }

        .bolt-3 {
            width: 100px !important;
            height: 2px !important;
            bottom: 25% !important;
            left: 30% !important;
            transform: rotate(60deg) !important;
            animation: plasmaStrike 2.5s ease-in-out infinite 2s !important;
        }

        .energy-field {
            position: absolute !important;
            border: 1px solid rgba(255, 200, 87, 0.2) !important;
            border-radius: 50% !important;
            background: radial-gradient(circle, 
                rgba(255, 200, 87, 0.05) 0%, 
                rgba(23, 162, 184, 0.05) 50%, 
                transparent 100%) !important;
            animation: energyPulse 6s ease-in-out infinite !important;
        }

        .field-1 {
            width: 300px !important;
            height: 300px !important;
            top: 20% !important;
            right: 10% !important;
        }

        .field-2 {
            width: 250px !important;
            height: 250px !important;
            bottom: 20% !important;
            left: 15% !important;
            animation-delay: 2s !important;
        }

        .field-3 {
            width: 180px !important;
            height: 180px !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            animation-delay: 4s !important;
        }

        /* Dashboard Container */
        .dashboard-container {
            max-width: 1400px !important;
            margin: 0 auto !important;
            padding: 2rem !important;
            position: relative !important;
            z-index: 10 !important;
        }

        /* Storm-themed Header */
        .dashboard-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin-bottom: 3rem !important;
            background: rgba(255, 255, 255, 0.02) !important;
            backdrop-filter: blur(30px) !important;
            border: 2px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 20px !important;
            padding: 1.5rem 2rem !important;
            box-shadow: 
                0 0 50px rgba(255, 200, 87, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .dashboard-header::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            height: 2px !important;
            background: linear-gradient(90deg, 
                transparent,
                var(--sunglow),
                var(--dark-cyan),
                transparent) !important;
            animation: stormSweep 3s ease-in-out infinite !important;
        }

        .dashboard-title {
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: 2.2rem !important;
            font-weight: 700 !important;
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f, var(--dark-cyan)) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            text-shadow: 0 0 30px rgba(255, 200, 87, 0.4) !important;
            filter: drop-shadow(0 0 10px rgba(255, 200, 87, 0.3)) !important;
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f) !important;
            color: var(--space-cadet) !important;
            border: 2px solid rgba(255, 200, 87, 0.5) !important;
            padding: 1.2rem 2.5rem !important;
            border-radius: 12px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            position: relative !important;
            overflow: hidden !important;
            box-shadow: 0 0 20px rgba(255, 200, 87, 0.3) !important;
        }

        .upload-btn::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: -100% !important;
            width: 100% !important;
            height: 100% !important;
            background: linear-gradient(90deg, 
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent) !important;
            transition: left 0.6s ease !important;
        }

        .upload-btn:hover::before {
            left: 100% !important;
        }

        .upload-btn:hover {
            transform: translateY(-2px) scale(1.05) !important;
            box-shadow: 
                0 0 40px rgba(255, 200, 87, 0.5),
                0 10px 30px rgba(255, 200, 87, 0.3) !important;
            border-color: var(--sunglow) !important;
        }

        /* Plasma Stats Cards */
        .stats-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) !important;
            gap: 2.5rem !important;
            margin-bottom: 3rem !important;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(30px) !important;
            border: 2px solid rgba(255, 200, 87, 0.2) !important;
            border-radius: 20px !important;
            padding: 2.5rem !important;
            transition: all 0.4s ease !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .stat-card::before {
            content: '' !important;
            position: absolute !important;
            top: -50% !important;
            left: -50% !important;
            width: 200% !important;
            height: 200% !important;
            background: linear-gradient(45deg,
                transparent 30%,
                rgba(255, 200, 87, 0.1) 50%,
                transparent 70%) !important;
            animation: plasmaSwirl 8s linear infinite !important;
            z-index: -1 !important;
        }

        .stat-card::after {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            height: 3px !important;
            background: linear-gradient(90deg,
                var(--sunglow),
                var(--dark-cyan),
                var(--sunglow)) !important;
            opacity: 0 !important;
            transition: opacity 0.3s ease !important;
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02) !important;
            box-shadow: 
                0 0 50px rgba(255, 200, 87, 0.2),
                0 20px 40px rgba(255, 200, 87, 0.15) !important;
            border-color: rgba(255, 200, 87, 0.6) !important;
        }

        .stat-card:hover::after {
            opacity: 1 !important;
        }

        .stat-number {
            font-size: 3.5rem !important;
            font-weight: 700 !important;
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            margin-bottom: 0.8rem !important;
            text-shadow: 0 0 20px rgba(255, 200, 87, 0.3) !important;
            animation: plasmaGlow 3s ease-in-out infinite alternate !important;
        }

        .stat-label {
            font-size: 1.2rem !important;
            color: rgba(255, 255, 255, 0.9) !important;
            margin-bottom: 0.5rem !important;
            font-weight: 500 !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1) !important;
        }

        .stat-value {
            font-size: 1rem !important;
            color: rgba(255, 255, 255, 0.7) !important;
        }

        /* Storm Performance Matrix */
        .performance-matrix {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(30px) !important;
            border: 2px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 20px !important;
            padding: 3rem !important;
            margin-bottom: 3rem !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .performance-matrix::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 200, 87, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(23, 162, 184, 0.05) 0%, transparent 50%) !important;
            animation: stormBackground 10s ease-in-out infinite !important;
            z-index: -1 !important;
        }

        .matrix-title {
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: 1.8rem !important;
            font-weight: 600 !important;
            margin-bottom: 2.5rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 1rem !important;
            text-shadow: 0 0 20px rgba(255, 200, 87, 0.3) !important;
        }

        .matrix-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) !important;
            gap: 2.5rem !important;
        }

        .matrix-item {
            text-align: center !important;
            position: relative !important;
        }

        .matrix-value {
            font-size: 3rem !important;
            font-weight: 700 !important;
            background: linear-gradient(135deg, var(--sunglow), var(--dark-cyan)) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            margin-bottom: 1.5rem !important;
            animation: stormNumber 4s ease-in-out infinite !important;
            filter: drop-shadow(0 0 10px rgba(255, 200, 87, 0.3)) !important;
        }

        .progress-bar {
            width: 100% !important;
            height: 12px !important;
            background: rgba(255, 255, 255, 0.1) !important;
            border-radius: 15px !important;
            overflow: hidden !important;
            margin-bottom: 1rem !important;
            position: relative !important;
            border: 1px solid rgba(255, 200, 87, 0.2) !important;
        }

        .progress-fill {
            height: 100% !important;
            background: linear-gradient(90deg, var(--sunglow), var(--dark-cyan)) !important;
            border-radius: 15px !important;
            transition: width 2s ease !important;
            position: relative !important;
            overflow: hidden !important;
            box-shadow: 0 0 20px rgba(255, 200, 87, 0.3) !important;
        }

        .progress-fill::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: -100% !important;
            width: 100% !important;
            height: 100% !important;
            background: linear-gradient(90deg, 
                transparent,
                rgba(255, 255, 255, 0.6),
                transparent) !important;
            animation: plasmaFlow 2s ease-in-out infinite !important;
        }

        /* Storm Action Buttons */
        .action-buttons {
            display: flex !important;
            gap: 1.5rem !important;
            flex-wrap: wrap !important;
            justify-content: center !important;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05) !important;
            color: white !important;
            border: 2px solid rgba(255, 200, 87, 0.3) !important;
            padding: 1.2rem 2.5rem !important;
            border-radius: 12px !important;
            font-weight: 500 !important;
            cursor: pointer !important;
            transition: all 0.4s ease !important;
            backdrop-filter: blur(20px) !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .action-btn::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: -100% !important;
            width: 100% !important;
            height: 100% !important;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 200, 87, 0.2),
                transparent) !important;
            transition: left 0.6s ease !important;
        }

        .action-btn:hover::before {
            left: 100% !important;
        }

        .action-btn:hover {
            background: rgba(255, 200, 87, 0.1) !important;
            border-color: var(--sunglow) !important;
            transform: translateY(-3px) !important;
            box-shadow: 
                0 0 30px rgba(255, 200, 87, 0.3),
                0 10px 25px rgba(255, 200, 87, 0.2) !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5) !important;
        }

        /* Storm Animations */
        @keyframes plasmaStrike {
            0%, 90%, 100% { opacity: 0; transform: scaleX(0); }
            10%, 80% { opacity: 1; transform: scaleX(1); }
            50% { opacity: 0.8; transform: scaleX(1.2); }
        }

        @keyframes energyPulse {
            0%, 100% { 
                transform: scale(1); 
                opacity: 0.3; 
                border-color: rgba(255, 200, 87, 0.2); 
            }
            50% { 
                transform: scale(1.1); 
                opacity: 0.6; 
                border-color: rgba(255, 200, 87, 0.5); 
            }
        }

        @keyframes stormSweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        @keyframes plasmaSwirl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes plasmaGlow {
            0% { 
                filter: drop-shadow(0 0 20px rgba(255, 200, 87, 0.3)); 
                text-shadow: 0 0 20px rgba(255, 200, 87, 0.3); 
            }
            100% { 
                filter: drop-shadow(0 0 30px rgba(255, 200, 87, 0.6)); 
                text-shadow: 0 0 30px rgba(255, 200, 87, 0.6); 
            }
        }

        @keyframes stormBackground {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes stormNumber {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        @keyframes plasmaFlow {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container { padding: 1rem !important; }
            .dashboard-header { 
                flex-direction: column !important; 
                gap: 1rem !important; 
                text-align: center !important; 
            }
            .stats-grid { grid-template-columns: 1fr !important; }
            .matrix-grid { grid-template-columns: 1fr !important; }
            .plasma-bolt, .energy-field { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="plasma-background">
        <div class="plasma-bolt bolt-1"></div>
        <div class="plasma-bolt bolt-2"></div>
        <div class="plasma-bolt bolt-3"></div>
        <div class="energy-field field-1"></div>
        <div class="energy-field field-2"></div>
        <div class="energy-field field-3"></div>
    </div>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1 class="dashboard-title">TURO TOLL TRACKER</h1>
            <button class="upload-btn">
                <i data-lucide="zap"></i>
                Upload CSVs / Run Fetch
            </button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">69</div>
                <div class="stat-label">TOTAL TOLLS</div>
                <div class="stat-value">Active tolls</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">50</div>
                <div class="stat-label">PERSONAL DRIVING TOLLS</div>
                <div class="stat-value">$1154.90</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">19</div>
                <div class="stat-label">MATCHED TOLLS</div>
                <div class="stat-value">$87.39</div>
            </div>
        </div>

        <div class="performance-matrix">
            <h2 class="matrix-title">
                <i data-lucide="zap"></i>
                PERFORMANCE MATRIX
            </h2>
            <div class="matrix-grid">
                <div class="matrix-item">
                    <div class="matrix-value">100%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 100%"></div>
                    </div>
                    <div>Matching Accuracy</div>
                </div>
                <div class="matrix-item">
                    <div class="matrix-value">69</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 85%"></div>
                    </div>
                    <div>Total Tolls</div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn">⚡ View Matched (19)</button>
            <button class="action-btn">⚡ Personal Driving (50)</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
