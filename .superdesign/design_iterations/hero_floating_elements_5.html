<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turo Toll Tracker - Floating Elements</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Flowbite -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        /* Custom Color Variables */
        :root {
            --space-cadet: #1f2041;
            --english-violet: #4b3f72;
            --sunglow: #ffc857;
            --dark-cyan: #119da4;
            --paynes-gray: #19647e;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif !important;
            margin: 0 !important;
            overflow-x: hidden !important;
        }
        
        .hero-container {
            min-height: 100vh !important;
            background: radial-gradient(ellipse at top left, var(--space-cadet) 0%, var(--english-violet) 30%, var(--paynes-gray) 60%, var(--space-cadet) 100%) !important;
            position: relative !important;
            overflow: hidden !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 2rem !important;
        }
        
        .floating-elements {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            pointer-events: none !important;
            z-index: 1 !important;
        }
        
        .floating-shape {
            position: absolute !important;
            opacity: 0.4 !important;
            animation-timing-function: ease-in-out !important;
            animation-iteration-count: infinite !important;
            animation-direction: alternate !important;
        }
        
        .shape-1 {
            top: 10% !important;
            left: 5% !important;
            width: 80px !important;
            height: 80px !important;
            background: linear-gradient(45deg, var(--sunglow), transparent) !important;
            border-radius: 20px !important;
            animation: floatVertical 8s, rotateClockwise 12s linear infinite !important;
        }
        
        .shape-2 {
            top: 20% !important;
            right: 10% !important;
            width: 60px !important;
            height: 60px !important;
            background: linear-gradient(45deg, var(--dark-cyan), transparent) !important;
            border-radius: 50% !important;
            animation: floatHorizontal 10s, pulse 4s infinite !important;
        }
        
        .shape-3 {
            bottom: 15% !important;
            left: 8% !important;
            width: 40px !important;
            height: 120px !important;
            background: linear-gradient(90deg, var(--english-violet), transparent) !important;
            border-radius: 40px !important;
            animation: floatDiagonal 12s, rotateCounterClockwise 15s linear infinite !important;
        }
        
        .shape-4 {
            bottom: 25% !important;
            right: 5% !important;
            width: 100px !important;
            height: 40px !important;
            background: linear-gradient(135deg, var(--paynes-gray), transparent) !important;
            border-radius: 25px !important;
            animation: floatVertical 9s, stretch 6s infinite !important;
        }
        
        .shape-5 {
            top: 50% !important;
            left: 2% !important;
            width: 50px !important;
            height: 50px !important;
            background: linear-gradient(45deg, var(--sunglow), var(--dark-cyan)) !important;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%) !important;
            animation: floatTriangle 11s, rotateClockwise 8s linear infinite !important;
        }
        
        .shape-6 {
            top: 35% !important;
            right: 3% !important;
            width: 70px !important;
            height: 70px !important;
            background: linear-gradient(90deg, var(--english-violet), var(--paynes-gray)) !important;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%) !important;
            animation: floatHexagon 13s, pulse 5s infinite !important;
        }
        
        .hero-content {
            position: relative !important;
            z-index: 10 !important;
            text-align: center !important;
            color: white !important;
            max-width: 1200px !important;
            width: 100% !important;
        }
        
        .hero-badge {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            background: rgba(255, 200, 87, 0.15) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 50px !important;
            padding: 0.75rem 1.5rem !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            margin-bottom: 2rem !important;
            color: var(--sunglow) !important;
            animation: slideInDown 0.8s ease-out !important;
        }
        
        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem) !important;
            font-weight: 900 !important;
            line-height: 1.1 !important;
            margin-bottom: 1.5rem !important;
            background: linear-gradient(135deg, white, var(--sunglow), var(--dark-cyan)) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            animation: slideInUp 1s ease-out 0.2s both !important;
            text-shadow: 0 10px 30px rgba(255, 200, 87, 0.3) !important;
        }
        
        .hero-subtitle {
            font-size: clamp(1.25rem, 3vw, 1.75rem) !important;
            margin-bottom: 3rem !important;
            opacity: 0.9 !important;
            max-width: 600px !important;
            margin-left: auto !important;
            margin-right: auto !important;
            line-height: 1.6 !important;
            animation: slideInUp 1s ease-out 0.4s both !important;
        }
        
        .login-card {
            background: linear-gradient(135deg, rgba(75, 63, 114, 0.25), rgba(25, 100, 126, 0.2)) !important;
            backdrop-filter: blur(40px) !important;
            border: 2px solid rgba(255, 200, 87, 0.2) !important;
            border-radius: 32px !important;
            padding: 3rem !important;
            max-width: 450px !important;
            margin: 0 auto 3rem !important;
            box-shadow: 
                0 25px 50px rgba(31, 32, 65, 0.5),
                0 0 100px rgba(255, 200, 87, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
            animation: floatingCard 1s ease-out 0.6s both, cardFloat 6s ease-in-out infinite 2s !important;
            position: relative !important;
        }
        
        .login-card::before {
            content: '' !important;
            position: absolute !important;
            inset: -2px !important;
            background: linear-gradient(45deg, var(--sunglow), var(--dark-cyan), var(--english-violet), var(--paynes-gray)) !important;
            border-radius: inherit !important;
            z-index: -1 !important;
            opacity: 0.7 !important;
            animation: borderGlow 3s linear infinite !important;
        }
        
        .form-title {
            font-size: 2rem !important;
            font-weight: 700 !important;
            margin-bottom: 0.5rem !important;
            color: white !important;
        }
        
        .form-subtitle {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 1rem !important;
            margin-bottom: 2rem !important;
        }
        
        .form-input {
            width: 100% !important;
            padding: 1.25rem 1.5rem !important;
            background: rgba(25, 100, 126, 0.3) !important;
            border: 1px solid rgba(255, 200, 87, 0.3) !important;
            border-radius: 16px !important;
            color: white !important;
            font-size: 1rem !important;
            margin-bottom: 1.5rem !important;
            transition: all 0.3s ease !important;
            position: relative !important;
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        
        .form-input:focus {
            outline: none !important;
            border-color: var(--sunglow) !important;
            background: rgba(25, 100, 126, 0.4) !important;
            box-shadow: 0 0 30px rgba(255, 200, 87, 0.3) !important;
            transform: translateY(-2px) !important;
        }
        
        .signin-btn {
            width: 100% !important;
            background: linear-gradient(135deg, var(--sunglow), #ffdc7f) !important;
            color: var(--space-cadet) !important;
            border: none !important;
            padding: 1.5rem !important;
            border-radius: 16px !important;
            font-size: 1.125rem !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            margin-bottom: 2rem !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
            position: relative !important;
            overflow: hidden !important;
        }
        
        .signin-btn::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: -100% !important;
            width: 100% !important;
            height: 100% !important;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent) !important;
            transition: left 0.5s ease !important;
        }
        
        .signin-btn:hover::before {
            left: 100% !important;
        }
        
        .signin-btn:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 20px 40px rgba(255, 200, 87, 0.5) !important;
        }
        
        .social-btn {
            background: rgba(17, 157, 164, 0.2) !important;
            border: 1px solid rgba(17, 157, 164, 0.4) !important;
            color: white !important;
            padding: 1rem !important;
            border-radius: 16px !important;
            transition: all 0.3s ease !important;
            margin: 0.5rem !important;
            width: 45% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.5rem !important;
        }
        
        .social-btn:hover {
            background: rgba(17, 157, 164, 0.3) !important;
            border-color: var(--dark-cyan) !important;
            transform: translateY(-2px) !important;
        }
        
        .hero-stats {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 2rem !important;
            margin-top: 3rem !important;
            animation: slideInUp 1s ease-out 0.8s both !important;
        }
        
        .stat-item {
            text-align: center !important;
            background: rgba(255, 200, 87, 0.1) !important;
            border: 1px solid rgba(255, 200, 87, 0.2) !important;
            border-radius: 20px !important;
            padding: 1.5rem !important;
            backdrop-filter: blur(15px) !important;
            transition: all 0.3s ease !important;
        }
        
        .stat-item:hover {
            transform: translateY(-5px) !important;
            background: rgba(255, 200, 87, 0.15) !important;
            box-shadow: 0 15px 30px rgba(255, 200, 87, 0.2) !important;
        }
        
        .stat-number {
            font-size: 2.5rem !important;
            font-weight: 900 !important;
            color: var(--sunglow) !important;
            margin-bottom: 0.5rem !important;
        }
        
        .stat-label {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
        }
        
        /* Animations */
        @keyframes floatVertical {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }
        
        @keyframes floatHorizontal {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(20px); }
        }
        
        @keyframes floatDiagonal {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(15px, -20px); }
            50% { transform: translate(-10px, -35px); }
            75% { transform: translate(20px, -15px); }
        }
        
        @keyframes floatTriangle {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            33% { transform: translateY(-25px) translateX(10px); }
            66% { transform: translateY(-10px) translateX(-15px); }
        }
        
        @keyframes floatHexagon {
            0%, 100% { transform: translate(0px, 0px); }
            50% { transform: translate(-20px, 25px); }
        }
        
        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes rotateCounterClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        
        @keyframes stretch {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(1.2); }
        }
        
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes floatingCard {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero-container { padding: 1rem !important; }
            .login-card { padding: 2rem !important; }
            .hero-stats { grid-template-columns: 1fr !important; }
            .social-btn { width: 100% !important; margin: 0.25rem 0 !important; }
            .floating-shape { transform: scale(0.7) !important; }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="floating-elements">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="floating-shape shape-4"></div>
            <div class="floating-shape shape-5"></div>
            <div class="floating-shape shape-6"></div>
        </div>
        
        <div class="hero-content">
            <div class="hero-badge">
                <i data-lucide="sparkles" style="width: 1rem; height: 1rem;"></i>
                AI-Powered Precision
            </div>
            
            <h1 class="hero-title">
                ELEVATE YOUR<br>
                TOLL GAME
            </h1>
            
            <p class="hero-subtitle">
                Next-generation toll management with floating AI intelligence. Experience the future today.
            </p>
            
            <div class="login-card">
                <h2 class="form-title">Enter The Matrix</h2>
                <p class="form-subtitle">Unlock your digital dashboard</p>
                
                <form>
                    <input type="email" class="form-input" placeholder="Your Email Address" required>
                    <input type="password" class="form-input" placeholder="Secure Password" required>
                    
                    <button type="submit" class="signin-btn">Access Control Hub</button>
                </form>
                
                <div style="text-align: center; margin: 1.5rem 0; color: rgba(255,255,255,0.7);">
                    or connect via
                </div>
                
                <div style="text-align: center;">
                    <button class="social-btn">
                        <i data-lucide="chrome" style="width: 1rem; height: 1rem;"></i>
                        Google
                    </button>
                    <button class="social-btn">
                        <i data-lucide="microsoft" style="width: 1rem; height: 1rem;"></i>
                        Microsoft
                    </button>
                </div>
            </div>
            
            <div class="hero-stats">
                <div class="stat-item">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">Automated</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">$10M+</div>
                    <div class="stat-label">Tracked</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">50K+</div>
                    <div class="stat-label">Hosts</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
