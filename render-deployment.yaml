services:
  # Main Web Service
  - type: web
    name: turo-toll-tracker
    env: node
    plan: starter  # Can be upgraded to standard for production
    region: oregon # Change to your preferred region
    buildCommand: |
      echo "🔧 Starting build process..."
      npm ci --production=false
      echo "📦 Installing PostgreSQL client..."
      npm install pg
      echo "🧪 Running any pre-build checks..."
      npm run build
      echo "✅ Build completed successfully"
    startCommand: npm start
    envVars:
      # Core Application Settings
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false  # Render provides this automatically
      
      # Security Configuration (Generate these!)
      - key: SESSION_SECRET
        generateValue: true  # Render will generate a secure value
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true  # Render will generate a secure value
      
      # Database Configuration
      - key: DATABASE_URL
        fromDatabase:
          name: turo-toll-db
          property: connectionString
      
      # Application Configuration
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: MAX_FILES_PER_REQUEST
        value: 5
      
      # Performance Settings
      - key: PERFORMANCE_MONITORING
        value: true
      - key: PERFORMANCE_SAMPLE_RATE
        value: 1.0
      
      # Custom Domain Settings
      - key: DOMAIN
        value: turoezpass.com
      - key: ALLOWED_ORIGINS
        value: https://turoezpass.com,https://www.turoezpass.com
      
      # Email Configuration (Optional - add if you want notifications)
      # - key: SMTP_HOST
      #   value: smtp.sendgrid.net
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   value: apikey
      # - key: SMTP_PASS
      #   value: your-sendgrid-api-key
      # - key: FROM_EMAIL
      #   value: noreply@turoezpass.com
    
    # Health Check Configuration
    healthCheckPath: /health
    
    # Custom Domains
    domains:
      - turoezpass.com
      - www.turoezpass.com
    
    # Disk Storage for File Uploads
    disk:
      name: turo-toll-storage
      mountPath: /app/uploads
      sizeGB: 1

  # PostgreSQL Database
  - type: pgsql
    name: turo-toll-db
    plan: starter  # Free tier - can be upgraded
    region: oregon # Same region as web service
    databaseName: turo_tolls
    user: turo_admin
    ipAllowList: [] # Empty means allow from Render services only
    
    # Database Configuration
    postgresMajorVersion: 15
    
  # Redis Cache (Optional - uncomment if you want caching)
  # - type: redis
  #   name: turo-toll-cache
  #   plan: starter
  #   region: oregon
  #   ipAllowList: []

