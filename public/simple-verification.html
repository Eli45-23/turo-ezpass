<!DOCTYPE html>
<html>
<head>
    <title>Simple Verification Test</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
        }
        .modal-content {
            position: relative;
            margin: 10% auto;
            padding: 20px;
            width: 400px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }
        .method-button {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            border: 2px solid #ddd;
            cursor: pointer;
            border-radius: 5px;
            background: white;
        }
        .method-button:hover {
            border-color: #007bff;
        }
        .method-button.selected {
            border-color: #28a745 !important;
            background: #d4edda !important;
        }
        #code-section {
            display: none;
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 200px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Simple Verification Test</h1>
    <button onclick="startVerification()">Start Verification</button>
    
    <div id="verification-modal" class="modal">
        <div class="modal-content">
            <h3>EZ-Pass Verification Required</h3>
            <p>How would you like to receive the verification code?</p>
            
            <div class="method-button" onclick="selectMethod('email')" id="email-btn">
                📧 Email
            </div>
            <div class="method-button" onclick="selectMethod('sms')" id="sms-btn">
                📱 Text Message
            </div>
            
            <div id="code-section">
                <p>Enter the verification code:</p>
                <input type="text" id="verification-code" placeholder="Enter code">
                <br>
                <button onclick="submitCode()">Submit Code</button>
            </div>
            
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        let selectedDeliveryMethod = null;

        function startVerification() {
            currentSessionId = 'test-session-' + Date.now();
            console.log('🚀 Starting verification with session:', currentSessionId);
            
            // Clear any previous selection
            selectedDeliveryMethod = null;
            document.getElementById('email-btn').classList.remove('selected');
            document.getElementById('sms-btn').classList.remove('selected');
            document.getElementById('code-section').style.display = 'none';
            document.getElementById('verification-code').value = '';
            
            // Show modal
            document.getElementById('verification-modal').style.display = 'block';
        }

        function selectMethod(method) {
            console.log('🎯 User selected:', method);
            selectedDeliveryMethod = method;
            
            // Clear all selections
            document.getElementById('email-btn').classList.remove('selected');
            document.getElementById('sms-btn').classList.remove('selected');
            
            // Mark selected
            document.getElementById(method + '-btn').classList.add('selected');
            
            // IMMEDIATELY call API to update session
            updateSession(currentSessionId, method);
        }

        async function updateSession(sessionId, deliveryMethod) {
            console.log('📤 CALLING API:', sessionId, deliveryMethod);
            
            try {
                const response = await fetch('/api/tolls/request-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, deliveryMethod })
                });
                
                const result = await response.json();
                console.log('✅ API Response:', result);
                
                if (result.success) {
                    // Show code input
                    document.getElementById('code-section').style.display = 'block';
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('❌ API Error:', error);
                alert('API call failed: ' + error.message);
            }
        }

        async function submitCode() {
            const code = document.getElementById('verification-code').value;
            
            if (!code) {
                alert('Please enter the verification code');
                return;
            }
            
            console.log('📤 Submitting code:', code);
            
            try {
                const response = await fetch('/api/tolls/verify-device', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        sessionId: currentSessionId, 
                        code: code,
                        deliveryMethod: selectedDeliveryMethod
                    })
                });
                
                const result = await response.json();
                console.log('✅ Code submission result:', result);
                
                if (result.success) {
                    alert('Verification successful!');
                    closeModal();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('❌ Code submission error:', error);
                alert('Code submission failed: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('verification-modal').style.display = 'none';
        }
    </script>
</body>
</html>
