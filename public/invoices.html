        .modal-content {
            background: rgba(255, 255, 255, 0.08) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 16px !important;

            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;

        .party-section h4 {

        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .fade-in-delay-1 { animation-delay: 0.1s; }
        .fade-in-delay-2 { animation-delay: 0.2s; }
        .fade-in-delay-3 { animation-delay: 0.3s; }
        .fade-in-delay-4 { animation-delay: 0.4s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }

                grid-template-columns: 1fr auto;
                gap: 1rem;

                display: none;

            }

        .nav-item.active {

    <script>
        // Invoice data loaded from API
        let invoicesData = [];
        
        let currentInvoice = null;
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadInvoices();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // Use debounced search for better performance
            const debouncedFilter = performanceOptimizer.debounce(filterInvoices, 300, 'invoices-search');
            document.getElementById('search-invoices').addEventListener('input', debouncedFilter);
            document.getElementById('date-filter').addEventListener('change', filterInvoices);
        }
        
        // Authentication helper function
        function getAuthHeaders() {
            const headers = {
                'Content-Type': 'application/json'
            };
            
            // Get stored token
            let storedToken = null;
            try {
                if (window.apiHelper && window.apiHelper.tokenStorage) {
                    storedToken = window.apiHelper.tokenStorage.getToken();
                } else if (typeof localStorage !== 'undefined') {
                    storedToken = localStorage.getItem('supabase_token');
                }
            } catch (error) {
                console.warn('Failed to get auth token:', error);
            }
            
            // Add Authorization header if we have a token
            if (storedToken) {
                headers['Authorization'] = `Bearer ${storedToken}`;
            }
            
            return headers;
        }
        
        // Loading state functions
        function showLoading() {
            // No visual loading indicators needed - function exists to prevent errors
        }
        
        function hideLoading() {
            // No visual loading indicators needed - function exists to prevent errors
        }
        
        async function loadInvoices() {
            try {
                
                // Fetch invoices data from API
                console.log('📡 Fetching invoices data from API...');
                
                const response = await fetch('/api/invoices', {
                    method: 'GET',
                    credentials: 'include',
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('📊 Invoices data received:', data);
                
                if (data.success) {
                    invoicesData = data.data || [];
                } else {
                    throw new Error(data.error || 'Failed to load invoices data');
                }
                
                renderInvoices(invoicesData);
                updateInvoiceStats();
                
                hideLoading();
                
                showNotification({
                    type: 'success',
                    title: 'Data Loaded',
                    message: 'Invoices data updated successfully'
                });
                
            } catch (error) {
                console.error('❌ Failed to load invoices data:', error);
                hideLoading();
                
                // Show empty data if API fails
                invoicesData = [];
                renderInvoices([]);
                updateInvoiceStats();
                
                showNotification({
                    type: 'info',
                    title: 'No Data Available',
                    message: 'No invoices data found. Create some invoices to see them here.'
                });
            }
        }
        
        function renderInvoices(filteredInvoices = invoicesData) {
            const container = document.getElementById('invoices-list');
            
            if (filteredInvoices.length === 0) {
                container.innerHTML = `
                    <div style="padding: 2rem; text-align: center; color: var(--muted);">
                        No invoices found matching your criteria
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredInvoices.map(invoice => createInvoiceRow(invoice)).join('');
            
            // Re-initialize Lucide icons after updating content
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }
        
        function createInvoiceRow(invoice) {
            const statusMap = {
                paid: { class: 'status-paid', icon: 'check-circle', text: 'Paid' },
                sent: { class: 'status-paid', icon: 'check-circle', text: 'Sent' }
            };
            
            const status = statusMap[invoice.status] || statusMap['paid'];
            const guestName = invoice.guest || 'Unknown Guest';
            const initials = guestName.split(' ').map(n => n[0]).join('').toUpperCase();
            
            // Generate random avatar background colors like in the design
            const avatarColors = ['bg-yellow-600', 'bg-green-600', 'bg-blue-600', 'bg-purple-600', 'bg-orange-600'];
            const avatarColor = avatarColors[Math.abs(guestName.charCodeAt(0)) % avatarColors.length];
            
            return `
                <div class="invoice-item p-6 flex items-center">
                    <div class="flex items-center space-x-4 flex-1">
                        <div class="user-avatar ${avatarColor}">${initials}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-3 mb-2">
                                <h4 class="text-white font-semibold font-mono text-sm">${invoice.id}</h4>
                                <span class="status-badge ${status.class}">
                                    <i data-lucide="${status.icon}" class="w-3 h-3"></i>
                                    ${status.text}
                                </span>
                            </div>
                            <div class="text-sm text-gray-400">
                                <span>${guestName} • Trip #${invoice.tripId || 'Unknown'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-8">
                        <div class="text-right min-w-[100px]">
                            <div class="text-xs text-gray-400 mb-1">Invoice Date</div>
                            <div class="text-white font-semibold">${new Date(invoice.issueDate).toLocaleDateString()}</div>
                        </div>
                        <div class="text-right min-w-[80px]">
                            <div class="text-xs text-gray-400 mb-1">Amount</div>
                            <div class="text-white font-bold font-mono text-lg">$${(invoice.amount - (invoice.processingFee || 0)).toFixed(2)}</div>
                        </div>
                        
                        <div class="flex items-center space-x-3 ml-4">
                            <button class="p-2 hover:bg-blue-600/20 rounded-lg transition-colors border border-transparent hover:border-blue-400/30" onclick="previewInvoice('${invoice.invoiceId}')" title="View Invoice">
                                <i data-lucide="eye" class="w-5 h-5 text-blue-400"></i>
                            </button>
                            <button class="p-2 hover:bg-orange-600/20 rounded-lg transition-colors border border-transparent hover:border-orange-400/30" onclick="unsubmitTrip('${invoice.invoiceId}', '${invoice.tripId}')" title="Return to Trips">
                                <i data-lucide="undo-2" class="w-5 h-5 text-orange-400"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function filterInvoices() {
            const searchTerm = document.getElementById('search-invoices').value.toLowerCase();
            const dateFilter = document.getElementById('date-filter').value;
            
            const filtered = invoicesData.filter(invoice => {
                const matchesSearch = searchTerm === '' || 
                    invoice.id.toLowerCase().includes(searchTerm) ||
                    invoice.guest.toLowerCase().includes(searchTerm) ||
                    invoice.tripId.toLowerCase().includes(searchTerm);
                
                // Date filter logic would be implemented here
                const matchesDate = true; // Simplified for demo
                
                return matchesSearch && matchesDate;
            });
            
            renderInvoices(filtered);
        }
        
        function previewInvoice(invoiceId) {
            console.log('🔍 previewInvoice called with ID:', invoiceId, typeof invoiceId);
            console.log('📊 Available invoicesData:', invoicesData);
            
            // Debug: Log each invoice to understand the structure
            invoicesData.forEach((inv, index) => {
                console.log(`📋 Invoice ${index}:`, {
                    id: inv.id,
                    invoiceId: inv.invoiceId,
                    guest: inv.guest,
                    amount: inv.amount
                });
            });
            
            // Find the basic invoice data - try multiple approaches
            let basicInvoice = null;
            
            // First try: match invoiceId (internal database ID)
            basicInvoice = invoicesData.find(inv => String(inv.invoiceId) === String(invoiceId));
            
            // Second try: match id (invoice number)
            if (!basicInvoice) {
                basicInvoice = invoicesData.find(inv => String(inv.id) === String(invoiceId));
            }
            
            // Third try: match by converting to numbers
            if (!basicInvoice && !isNaN(invoiceId)) {
                basicInvoice = invoicesData.find(inv => 
                    Number(inv.invoiceId) === Number(invoiceId) || 
                    Number(inv.id) === Number(invoiceId)
                );
            }
            
            console.log('📋 Found basicInvoice:', basicInvoice);
            
            if (!basicInvoice) {
                console.error('❌ Invoice not found with ID:', invoiceId);
                console.error('🔍 Available IDs:', invoicesData.map(inv => ({ id: inv.id, invoiceId: inv.invoiceId })));
                showNotification({
                    type: 'error',
                    title: 'Invoice Not Found',
                    message: `Cannot find invoice with ID: ${invoiceId}`
                });
                return;
            }
            
            // Show basic invoice immediately
            currentInvoice = basicInvoice;
            generateInvoicePreview(basicInvoice);
            showModal();
            
            // Then enhance with toll charges for this trip
            loadTripTolls(basicInvoice.tripId, basicInvoice);
        }
        
        async function loadTripTolls(tripId, basicInvoice) {
            try {
                console.log('🔄 Loading toll charges for trip:', tripId);
                
                // Fetch trip details with toll charges
                const response = await fetch(`/api/trips/${tripId}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('📡 Trip toll data received:', data);
                
                if (data.success && data.data && data.data.tolls) {
                    // Transform toll charges to match expected format
                    const tollItems = data.data.tolls.map(toll => ({
                        description: `${toll.location} - ${toll.transponder || 'Toll'} #${toll.transactionId || 'N/A'}`,
                        amount: parseFloat(toll.amount || 0),
                        toll_date: toll.date,
                        toll_location: toll.location,
                        transaction_id: toll.transactionId,
                        plate_number: toll.transponder
                    }));
                    
                    // Merge basic invoice data with toll charges
                    const submissionDetails = {
                        ...basicInvoice,
                        items: tollItems,
                        tripDetails: data.data
                    };
                    
                    console.log('✅ Updating preview with toll charges:', submissionDetails);
                    currentInvoice = submissionDetails;
                    generateInvoicePreview(submissionDetails);
                    
                    showNotification({
                        type: 'success',
                        title: 'Toll Charges Loaded',
                        message: `Found ${tollItems.length} toll charges for this submission`
                    });
                } else {
                    console.log('ℹ️ No toll charges found for trip, keeping basic view');
                }
                
            } catch (error) {
                console.error('❌ Error loading trip toll charges:', error);
                // Don't show error notification as basic submission view is already displayed
                console.log('📋 Continuing with basic submission view');
            }
        }
        
        function generateInvoicePreview(invoice) {
            const preview = document.getElementById('invoice-preview');
            // Use toll total from trip details if available, otherwise fall back to invoice amount minus processing fee
            const total = (invoice.tripDetails && invoice.tripDetails.tollTotal) 
                ? parseFloat(invoice.tripDetails.tollTotal) 
                : parseFloat(invoice.amount) - parseFloat(invoice.processingFee || 0);
            
            preview.innerHTML = `
                <div class="invoice-header">
                    <div class="invoice-company">
                        <div class="company-name">Submission Details</div>
                        <div class="company-details">
                            Trip: ${invoice.tripId}<br>
                            Guest: ${invoice.guest || 'Unknown Guest'}<br>
                            Vehicle: ${invoice.vehicle || 'N/A'}<br>
                            ${invoice.tripDetails && invoice.tripDetails.startDate ? `Trip Start: ${new Date(invoice.tripDetails.startDate).toLocaleString()}<br>` : ''}
                            ${invoice.tripDetails && invoice.tripDetails.endDate ? `Trip End: ${new Date(invoice.tripDetails.endDate).toLocaleString()}<br>` : ''}
                            Submitted: ${new Date(invoice.issueDate).toLocaleDateString()}
                        </div>
                    </div>
                    <div class="invoice-meta">
                        <div class="invoice-date">
                            Total Amount: $${total.toFixed(2)}
                        </div>
                    </div>
                </div>
                
                <table class="invoice-table">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Date</th>
                            <th style="text-align: right;">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${invoice.items && invoice.items.length > 0 ? 
                            invoice.items.map(item => `
                                <tr>
                                    <td>${item.description || `${item.toll_location || 'Toll Charge'} - ${item.plate_number || invoice.vehicle || ''}`}</td>
                                    <td>${item.toll_date ? new Date(item.toll_date).toLocaleDateString() : 'N/A'}</td>
                                    <td style="text-align: right;">$${parseFloat(item.amount || 0).toFixed(2)}</td>
                                </tr>
                            `).join('') 
                        : `
                            <tr>
                                <td>Toll Charges for Trip #${invoice.tripId}</td>
                                <td>${new Date(invoice.issueDate).toLocaleDateString()}</td>
                                <td style="text-align: right;">$${total.toFixed(2)}</td>
                            </tr>
                        `}
                    </tbody>
                </table>
                
                <div class="invoice-totals">
                    <div class="total-row final">
                        <span>Total:</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                </div>
                
                <div class="invoice-notes">
                    <div class="notes-title">Submission Notes:</div>
                    <div class="notes-text">
                        These toll charges were submitted to Turo for collection from the guest. Turo handles all payment processing and collection. Tolls are automatically detected and calculated based on the trip route. The guest will be charged through Turo's platform.
                    </div>
                </div>
            `;
        }
        
        
        async function unsubmitTrip(invoiceId, tripId) {
            if (!confirm(`Are you sure you want to unsubmit trip #${tripId}? This will delete the invoice and move the trip back to the trips page.`)) {
                return;
            }
            
            try {
                showNotification({
                    type: 'info',
                    title: 'Unsubmitting Trip',
                    message: `Reversing submission for trip #${tripId}...`
                });
                
                const response = await fetch(`/api/invoices/${invoiceId}/unsubmit`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuthHeaders()
                    }
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    showNotification({
                        type: 'success',
                        title: 'Trip Unsubmitted',
                        message: `Trip #${result.trip.turoTripId} has been moved back to the trips page.`
                    });
                    
                    // Refresh the invoices data to remove the unsubmitted invoice
                    await loadInvoices();
                } else {
                    showNotification({
                        type: 'error',
                        title: 'Unsubmit Failed',
                        message: result.error || 'Failed to unsubmit trip'
                    });
                }
            } catch (error) {
                console.error('❌ Error unsubmitting trip:', error);
                showNotification({
                    type: 'error',
                    title: 'Error',
                    message: 'An error occurred while unsubmitting the trip'
                });
            }
        }
        
        function showModal() {
            document.getElementById('invoice-modal').classList.add('show');
        }
        
        function hideModal() {
            document.getElementById('invoice-modal').classList.remove('show');
            currentInvoice = null;
        }
        
        function bulkActions() {
            showNotification({
                type: 'info',
                title: 'Bulk Actions',
                message: 'Bulk operation tools coming soon'
            });
        }
        
        
        function refreshData() {
            showNotification({
                type: 'success',
                title: 'Data Refreshed',
                message: 'Invoice data has been updated'
            });
            loadInvoices();
        }
        
        function updateInvoiceStats() {
            const totalInvoices = invoicesData.length;
            const totalRevenue = invoicesData.reduce((sum, inv) => sum + ((inv.amount || 0) - (inv.processingFee || 0)), 0);
            
            updateEl('total-invoices', totalInvoices);
            updateEl('total-revenue', `$${totalRevenue.toFixed(2)}`);
        }
        
        
        // Close modal when clicking outside
        document.getElementById('invoice-modal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                hideModal();
            }
        });
        
        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('invoice-modal').classList.contains('show')) {
                hideModal();
            }
        });
    </script>
    
    <!-- Logout functionality -->
    <script>
        // User menu dropdown functionality
        const userMenu = document.getElementById('userMenu');
        const userDropdown = document.getElementById('userDropdown');
        const signOutBtn = document.getElementById('signOutBtn');
        
        if (userMenu && userDropdown) {
            // Toggle dropdown on user menu click
            userMenu.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                // Check if click is outside both the user menu button and dropdown
                if (!userMenu.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.classList.remove('show');
                }
            });
            
            // Handle sign out
            if (signOutBtn) {
                signOutBtn.addEventListener('click', handleSignOut);
            }
        }
        
        // Sign out function
        async function handleSignOut() {
            
            const signOutBtn = document.getElementById('signOutBtn');
            const userDropdown = document.getElementById('userDropdown');
            
            try {
                // Show loading state
                const originalText = signOutBtn.innerHTML;
                signOutBtn.innerHTML = '<span class="dropdown-icon">⏳</span>Signing out...';
                signOutBtn.disabled = true;
                
                // Clear stored tokens
                localStorage.removeItem('supabase_token');
                localStorage.removeItem('supabase_session');
                
                // Call logout endpoint
                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    console.log('✅ Logout successful');
                    window.location.href = '/';
                } else {
                    console.error('❌ Logout failed');
                    // Still redirect on failure as tokens are cleared
                    window.location.href = '/';
                }
                
            } catch (error) {
                console.error('❌ Logout error:', error);
                // Still redirect on error as tokens are cleared
                window.location.href = '/';
            }
        }
    </script>
    
    <!-- Initialize Lucide Icons -->
    <script>
        // Initialize Lucide icons when page loads
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
            
            // Re-initialize icons after any dynamic content changes
            setTimeout(() => {
                lucide.createIcons();
            }, 100);
        });
        
        // Also create icons immediately
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
