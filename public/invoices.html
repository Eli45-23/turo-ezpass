<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Tolls - Turo Toll Tracker</title>
    
    <!-- Design System -->
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/components.css">
    
    <!-- Scripts -->
    <script src="/js/ui-utils.js"></script>
    <script src="/js/xss-utils.js"></script>
    <script src="/js/performance.js"></script>
    <script src="/js/api-helper.js"></script>
    <script src="/js/auth-check.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        /* Invoice Page Specific Styles */
        :root {
            --header-height: 72px;
            --sidebar-width: 280px;
        }
        
        .invoices-layout {
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            display: grid;
            grid-template-rows: var(--header-height) 1fr;
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-areas: 
                "sidebar header"
                "sidebar main";
        }
        
        .invoices-header {
            grid-area: header;
            background: var(--panel);
            border-bottom: 1px solid var(--hairline);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
        }
        
        .invoices-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .invoices-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .invoices-main {
            grid-area: main;
            padding: 2rem;
            background: var(--bg);
        }
        
        .invoices-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Sidebar */
        .invoices-sidebar {
            grid-area: sidebar;
            background: var(--panel);
            border-right: 1px solid var(--hairline);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--hairline);
            font-family: var(--font-heading);
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: var(--ink);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1.5rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--muted);
            text-decoration: none;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            transition: all var(--transition-fast);
            position: relative;
        }

        .nav-item:hover {
            background: var(--hover);
            color: var(--ink);
        }

        .nav-item.active {
            background: var(--hover);
            color: var(--accentB);
            font-weight: var(--font-semibold);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(135deg, var(--accentA), var(--accentB), var(--accentC));
        }

        .nav-icon {
            font-size: var(--text-lg);
        }
        
        /* Responsive Design */
        @media (max-width: 1024px) {
            .invoices-layout {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "header"
                    "main";
            }

            .invoices-sidebar {
                display: none;
            }
        }
        
        .invoices-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--gap-lg);
            margin-bottom: 2rem;
        }
        
        .overview-card {
            background: var(--panel);
            border: 1px solid var(--hairline);
            border-radius: var(--radius);
            padding: var(--gap-lg);
            position: relative;
            overflow: hidden;
            transition: all var(--transition-fast);
        }
        
        .overview-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            pointer-events: none;
        }
        
        .overview-card:hover {
            border-color: var(--accentB);
            transform: translateY(-2px);
            box-shadow: var(--shadow-base);
        }
        
        .overview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .overview-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-lg);
            color: white;
            box-shadow: var(--shadow-sm);
        }
        
        .overview-value {
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            color: var(--ink);
            margin-bottom: 0.5rem;
        }
        
        .overview-label {
            font-size: var(--text-sm);
            color: var(--muted);
            margin-bottom: 0.5rem;
        }
        
        .overview-change {
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .overview-change.positive {
            color: #10B981;
        }
        
        .overview-change.negative {
            color: #EF4444;
        }
        
        .invoices-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .search-filters {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex: 1;
        }
        
        .search-input {
            min-width: 300px;
            position: relative;
        }
        
        .search-input input {
            padding-left: 2.5rem;
        }
        
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }
        
        .invoices-table {
            background: var(--panel);
            border: 1px solid var(--hairline);
            border-radius: var(--radius);
            overflow: hidden;
        }
        
        .table-header {
            padding: var(--gap-lg);
            border-bottom: 1px solid var(--hairline);
            background: var(--hover);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .table-title {
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            color: var(--ink);
            margin: 0;
        }
        
        .invoice-row {
            display: grid;
            grid-template-columns: 1fr 120px 100px 120px 150px;
            align-items: center;
            padding: 1rem var(--gap-lg);
            border-bottom: 1px solid var(--hairline);
            transition: all var(--transition-fast);
        }
        
        .invoice-row:hover {
            background: var(--hover);
        }
        
        .invoice-row:last-child {
            border-bottom: none;
        }
        
        .invoice-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .invoice-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accentA), var(--accentB));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: var(--font-bold);
            font-size: var(--text-sm);
        }
        
        .invoice-details h4 {
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            color: var(--ink);
            margin: 0 0 0.25rem 0;
        }
        
        .invoice-details p {
            font-size: var(--text-sm);
            color: var(--muted);
            margin: 0;
        }
        
        .invoice-status {
            text-align: center;
        }
        
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
        }
        
        .status-chip.paid {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        
        
        .invoice-amount {
            text-align: right;
            font-weight: var(--font-semibold);
            color: var(--ink);
        }
        
        .invoice-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
        
        .action-btn {
            width: 2rem;
            height: 2rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--hairline);
            background: var(--panel);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: var(--text-sm);
        }
        
        .action-btn:hover {
            background: var(--hover);
            color: var(--ink);
            border-color: var(--accentB);
        }
        
        .action-btn.primary:hover {
            background: rgba(34, 211, 238, 0.1);
            color: var(--accentB);
            border-color: var(--accentB);
        }
        
        /* Invoice Template Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: var(--z-modal-backdrop);
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--panel);
            border: 1px solid var(--hairline);
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            max-width: 800px;
            width: 90vw;
            max-height: 90vh;
            overflow: hidden;
        }
        
        .modal-header {
            padding: var(--gap-lg);
            border-bottom: 1px solid var(--hairline);
            background: var(--hover);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: var(--text-xl);
            font-weight: var(--font-semibold);
            color: var(--ink);
            margin: 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: var(--text-xl);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }
        
        .modal-close:hover {
            background: var(--panel);
            color: var(--ink);
        }
        
        .modal-body {
            padding: var(--gap-lg);
            overflow-y: auto;
            max-height: 60vh;
        }
        
        .modal-footer {
            padding: var(--gap-lg);
            border-top: 1px solid var(--hairline);
            background: var(--hover);
            display: flex;
            justify-content: flex-end;
            gap: var(--gap);
        }
        
        /* Invoice Preview */
        .invoice-preview {
            background: white;
            color: #000;
            padding: 2rem;
            border-radius: var(--radius-sm);
            margin: 1rem 0;
        }
        
        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .invoice-company {
            flex: 1;
        }
        
        .company-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .company-details {
            color: #6b7280;
            font-size: 0.875rem;
            line-height: 1.4;
        }
        
        .invoice-meta {
            text-align: right;
        }
        
        .invoice-number {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .invoice-date {
            color: #6b7280;
            font-size: 0.875rem;
        }
        
        .invoice-parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .party-section h4 {
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .party-details {
            color: #6b7280;
            font-size: 0.875rem;
            line-height: 1.4;
        }
        
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        
        .invoice-table th {
            background: #f9fafb;
            padding: 0.75rem;
            text-align: left;
            font-weight: bold;
            color: #1f2937;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .invoice-table td {
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }
        
        .invoice-totals {
            margin-left: auto;
            width: 300px;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .total-row.final {
            font-weight: bold;
            font-size: 1.125rem;
            border-bottom: 2px solid #1f2937;
            margin-top: 0.5rem;
        }
        
        .invoice-notes {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
        }
        
        .notes-title {
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .notes-text {
            color: #6b7280;
            font-size: 0.875rem;
            line-height: 1.4;
        }
        
        @media (max-width: 1024px) {
            .invoice-row {
                grid-template-columns: 1fr auto;
                gap: 1rem;
            }
            
            .invoice-row > *:not(.invoice-info):not(.invoice-actions) {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .invoices-main {
                padding: 1rem;
            }
            
            .invoices-header {
                padding: 1rem;
            }
            
            .invoices-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-filters {
                flex-direction: column;
            }
            
            .search-input {
                min-width: auto;
            }
            
            .invoice-parties {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .invoice-preview {
                padding: 1rem;
            }
        }
        
        /* Dashboard Styles */
        .dashboard-bg {
            background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #4b5563 100%);
        }
        
        .sidebar-bg {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        
        /* Navigation Animations */
        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(8px);
        }
        
        .nav-item.active {
            background: rgba(99, 102, 241, 0.3);
            border-left: 3px solid #6366f1;
            transform: translateX(4px);
        }
        
        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
        }
        
        .nav-item:hover::before {
            width: 3px;
        }
        
        /* Colorful Navigation Icons */
        .nav-item .icon-dashboard,
        .nav-item .icon-dashboard svg {
            color: #3b82f6 !important; /* Blue for Dashboard/Overview */
            stroke: #3b82f6 !important;
        }
        
        .nav-item .icon-map,
        .nav-item .icon-map svg {
            color: #f59e0b !important; /* Orange for Trips/Map */
            stroke: #f59e0b !important;
        }
        
        .nav-item .icon-upload,
        .nav-item .icon-upload svg {
            color: #8b5cf6 !important; /* Purple for Upload */
            stroke: #8b5cf6 !important;
        }
        
        .nav-item .icon-analytics,
        .nav-item .icon-analytics svg {
            color: #10b981 !important; /* Green for Analytics */
            stroke: #10b981 !important;
        }
        
        .nav-item .icon-transponders,
        .nav-item .icon-transponders svg {
            color: #ef4444 !important; /* Red for Transponders */
            stroke: #ef4444 !important;
        }
        
        .nav-item .icon-invoices,
        .nav-item .icon-invoices svg {
            color: #06b6d4 !important; /* Cyan for Invoices */
            stroke: #06b6d4 !important;
        }
        
        /* Dropdown menu styles */
        .dropdown-menu {
            position: absolute;
            top: 50px;
            right: 0;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen dashboard-bg font-inter text-white">
    <div class="flex h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 sidebar-bg border-r border-gray-600">
            <div class="p-6">
                <h1 class="text-white font-mono text-lg font-bold tracking-wide">TURO TOLL TRACKER</h1>
            </div>
            
            <!-- Navigation -->
            <nav class="px-4 space-y-1">
                <a href="/dashboard.html" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-r-lg text-white/70 hover:text-white">
                    <i data-lucide="layout-dashboard" class="icon-dashboard w-7 h-7"></i>
                    <span class="font-medium">OVERVIEW</span>
                </a>
                <a href="/trips.html" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-r-lg text-white/70 hover:text-white">
                    <i data-lucide="map" class="icon-map w-7 h-7"></i>
                    <span class="font-medium">TRIPS</span>
                </a>
                <a href="/upload.html" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-r-lg text-white/70 hover:text-white">
                    <i data-lucide="upload" class="icon-upload w-7 h-7"></i>
                    <span class="font-medium">UPLOAD CSV</span>
                </a>
                <a href="/analytics.html" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-r-lg text-white/70 hover:text-white">
                    <i data-lucide="bar-chart-3" class="icon-analytics w-7 h-7"></i>
                    <span class="font-medium">ANALYTICS</span>
                </a>
                <a href="/transponders.html" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-r-lg text-white/70 hover:text-white">
                    <i data-lucide="radio" class="icon-transponders w-7 h-7"></i>
                    <span class="font-medium">TRANSPONDERS</span>
                </a>
                <a href="/invoices.html" class="nav-item active flex items-center space-x-3 px-4 py-3 rounded-r-lg text-white">
                    <i data-lucide="file-text" class="icon-invoices w-7 h-7"></i>
                    <span class="font-medium">SUBMITTED TOLLS</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <!-- Header -->
            <header class="invoices-header">
            <h1 class="h2">🚗 SUBMITTED TOLLS</h1>
            
            <div class="nav-actions">
                <div class="relative">
                    <button class="btn btn-secondary btn-sm" title="Sign Out" id="userMenu">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                    <div class="absolute top-12 right-0 bg-gray-700/90 backdrop-blur-lg border border-gray-600 rounded-lg py-2 min-w-40 shadow-lg opacity-0 invisible -translate-y-2 transition-all duration-200 z-50 dropdown-menu" id="userDropdown">
                        <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-300 no-underline transition-all duration-200 cursor-pointer text-sm hover:text-white hover:bg-white/5" id="signOutBtn">
                            <i data-lucide="log-out"></i>
                            Sign Out
                        </a>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="invoices-main">
            <div class="invoices-content">
                <!-- Overview Cards -->
            <div class="invoices-overview">
                <div class="overview-card">
                    <div class="overview-header">
                        <div class="overview-icon" style="background: linear-gradient(135deg, var(--accentA), var(--accentB));">📄</div>
                    </div>
                    <div class="overview-value" id="total-invoices">0</div>
                    <div class="overview-label">Total Submissions</div>
                </div>
                
                <div class="overview-card">
                    <div class="overview-header">
                        <div class="overview-icon" style="background: #10B981;">💰</div>
                    </div>
                    <div class="overview-value" id="total-revenue">$0.00</div>
                    <div class="overview-label">Total Revenue</div>
                </div>
                
            </div>
            
            <!-- Controls -->
            <div class="invoices-controls">
                <div class="search-filters">
                    <div class="search-input">
                        <input type="text" class="form-input" placeholder="Search submissions..." id="search-invoices">
                        <div class="search-icon">🔍</div>
                    </div>
                    
                    
                    <select class="form-select" id="date-filter">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                        <option value="quarter">This Quarter</option>
                    </select>
                </div>
                
                <div class="table-actions">
                    <button class="btn btn-ghost btn-sm" onclick="refreshData()">
                        <span>🔄</span>
                        Refresh
                    </button>
                </div>
            </div>
            
            <!-- Invoices Table -->
            <div class="invoices-table">
                <div class="table-header">
                    <h3 class="table-title">Submission List</h3>
                    <div class="table-actions">
                        <button class="btn btn-ghost btn-sm" onclick="bulkActions()">
                            <span>☑️</span>
                            Bulk Actions
                        </button>
                    </div>
                </div>
                
                <div class="table-body" id="invoices-list">
                    <!-- Invoice rows will be populated here -->
                </div>
            </div>
            </div>
        </main>
        </div>
    </div>
    
    <!-- Invoice Preview Modal -->
    <div class="modal-overlay" id="invoice-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Submission Details</h3>
                <button class="modal-close" onclick="hideModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="invoice-preview" id="invoice-preview">
                    <!-- Invoice content will be populated here -->
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideModal()">Close</button>
            </div>
        </div>
    </div>
    
    <!-- Notification Container -->
    <div id="notification-container"></div>
    
    <script>
        // Invoice data loaded from API
        let invoicesData = [];
        
        let currentInvoice = null;
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadInvoices();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // Use debounced search for better performance
            const debouncedFilter = performanceOptimizer.debounce(filterInvoices, 300, 'invoices-search');
            document.getElementById('search-invoices').addEventListener('input', debouncedFilter);
            document.getElementById('date-filter').addEventListener('change', filterInvoices);
        }
        
        // Authentication helper function
        function getAuthHeaders() {
            const headers = {
                'Content-Type': 'application/json'
            };
            
            // Get stored token
            let storedToken = null;
            try {
                if (window.apiHelper && window.apiHelper.tokenStorage) {
                    storedToken = window.apiHelper.tokenStorage.getToken();
                } else if (typeof localStorage !== 'undefined') {
                    storedToken = localStorage.getItem('supabase_token');
                }
            } catch (error) {
                console.warn('Failed to get auth token:', error);
            }
            
            // Add Authorization header if we have a token
            if (storedToken) {
                headers['Authorization'] = `Bearer ${storedToken}`;
            }
            
            return headers;
        }
        
        async function loadInvoices() {
            try {
                
                // Fetch invoices data from API
                console.log('📡 Fetching invoices data from API...');
                
                const response = await fetch('/api/invoices', {
                    method: 'GET',
                    credentials: 'include',
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('📊 Invoices data received:', data);
                
                if (data.success) {
                    invoicesData = data.data || [];
                } else {
                    throw new Error(data.error || 'Failed to load invoices data');
                }
                
                renderInvoices(invoicesData);
                updateInvoiceStats();
                
                hideLoading();
                
                showNotification({
                    type: 'success',
                    title: 'Data Loaded',
                    message: 'Invoices data updated successfully'
                });
                
            } catch (error) {
                console.error('❌ Failed to load invoices data:', error);
                hideLoading();
                
                // Show empty data if API fails
                invoicesData = [];
                renderInvoices([]);
                updateInvoiceStats();
                
                showNotification({
                    type: 'info',
                    title: 'No Data Available',
                    message: 'No invoices data found. Create some invoices to see them here.'
                });
            }
        }
        
        function renderInvoices(filteredInvoices = invoicesData) {
            const container = document.getElementById('invoices-list');
            
            if (filteredInvoices.length === 0) {
                container.innerHTML = `
                    <div style="padding: 2rem; text-align: center; color: var(--muted);">
                        No invoices found matching your criteria
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredInvoices.map(invoice => createInvoiceRow(invoice)).join('');
        }
        
        function createInvoiceRow(invoice) {
            const statusMap = {
                paid: { class: 'paid', icon: '✅', text: 'Paid' },
                sent: { class: 'paid', icon: '📤', text: 'Sent' }
            };
            
            const status = statusMap[invoice.status] || statusMap['paid'];
            const guestName = invoice.guest || 'Unknown Guest';
            const initials = guestName.split(' ').map(n => n[0]).join('').toUpperCase();
            
            return `
                <div class="invoice-row">
                    <div class="invoice-info">
                        <div class="invoice-avatar">${initials}</div>
                        <div class="invoice-details">
                            <h4>${invoice.id}</h4>
                            <p>${guestName} • Trip #${invoice.tripId || 'Unknown'}</p>
                        </div>
                    </div>
                    
                    <div class="invoice-status">
                        <div class="status-chip ${status.class}">
                            <span>${status.icon}</span>
                            ${status.text}
                        </div>
                    </div>
                    
                    <div class="invoice-amount">
                        $${(invoice.amount - (invoice.processingFee || 0)).toFixed(2)}
                    </div>
                    
                    <div style="text-align: center; color: var(--ink); font-size: var(--text-sm);">
                        ${new Date(invoice.issueDate).toLocaleDateString()}
                    </div>
                    
                    
                    <div class="invoice-actions">
                        <button class="action-btn primary" onclick="previewInvoice('${invoice.invoiceId}')" title="View Invoice">
                            👁️
                        </button>
                        <button class="action-btn" onclick="unsubmitTrip('${invoice.invoiceId}', '${invoice.tripId}')" title="Return to Trips" style="background: var(--warning); color: white;">
                            ↩️
                        </button>
                    </div>
                </div>
            `;
        }
        
        function filterInvoices() {
            const searchTerm = document.getElementById('search-invoices').value.toLowerCase();
            const dateFilter = document.getElementById('date-filter').value;
            
            const filtered = invoicesData.filter(invoice => {
                const matchesSearch = searchTerm === '' || 
                    invoice.id.toLowerCase().includes(searchTerm) ||
                    invoice.guest.toLowerCase().includes(searchTerm) ||
                    invoice.tripId.toLowerCase().includes(searchTerm);
                
                // Date filter logic would be implemented here
                const matchesDate = true; // Simplified for demo
                
                return matchesSearch && matchesDate;
            });
            
            renderInvoices(filtered);
        }
        
        function previewInvoice(invoiceId) {
            console.log('🔍 previewInvoice called with ID:', invoiceId, typeof invoiceId);
            console.log('📊 Available invoicesData:', invoicesData);
            
            // Debug: Log each invoice to understand the structure
            invoicesData.forEach((inv, index) => {
                console.log(`📋 Invoice ${index}:`, {
                    id: inv.id,
                    invoiceId: inv.invoiceId,
                    guest: inv.guest,
                    amount: inv.amount
                });
            });
            
            // Find the basic invoice data - try multiple approaches
            let basicInvoice = null;
            
            // First try: match invoiceId (internal database ID)
            basicInvoice = invoicesData.find(inv => String(inv.invoiceId) === String(invoiceId));
            
            // Second try: match id (invoice number)
            if (!basicInvoice) {
                basicInvoice = invoicesData.find(inv => String(inv.id) === String(invoiceId));
            }
            
            // Third try: match by converting to numbers
            if (!basicInvoice && !isNaN(invoiceId)) {
                basicInvoice = invoicesData.find(inv => 
                    Number(inv.invoiceId) === Number(invoiceId) || 
                    Number(inv.id) === Number(invoiceId)
                );
            }
            
            console.log('📋 Found basicInvoice:', basicInvoice);
            
            if (!basicInvoice) {
                console.error('❌ Invoice not found with ID:', invoiceId);
                console.error('🔍 Available IDs:', invoicesData.map(inv => ({ id: inv.id, invoiceId: inv.invoiceId })));
                showNotification({
                    type: 'error',
                    title: 'Invoice Not Found',
                    message: `Cannot find invoice with ID: ${invoiceId}`
                });
                return;
            }
            
            // Show basic invoice immediately
            currentInvoice = basicInvoice;
            generateInvoicePreview(basicInvoice);
            showModal();
            
            // Then enhance with toll charges for this trip
            loadTripTolls(basicInvoice.tripId, basicInvoice);
        }
        
        async function loadTripTolls(tripId, basicInvoice) {
            try {
                console.log('🔄 Loading toll charges for trip:', tripId);
                
                // Fetch trip details with toll charges
                const response = await fetch(`/api/trips/${tripId}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('📡 Trip toll data received:', data);
                
                if (data.success && data.data && data.data.tolls) {
                    // Transform toll charges to match expected format
                    const tollItems = data.data.tolls.map(toll => ({
                        description: `${toll.location} - ${toll.transponder || 'Toll'} #${toll.transactionId || 'N/A'}`,
                        amount: parseFloat(toll.amount || 0),
                        toll_date: toll.date,
                        toll_location: toll.location,
                        transaction_id: toll.transactionId,
                        plate_number: toll.transponder
                    }));
                    
                    // Merge basic invoice data with toll charges
                    const submissionDetails = {
                        ...basicInvoice,
                        items: tollItems,
                        tripDetails: data.data
                    };
                    
                    console.log('✅ Updating preview with toll charges:', submissionDetails);
                    currentInvoice = submissionDetails;
                    generateInvoicePreview(submissionDetails);
                    
                    showNotification({
                        type: 'success',
                        title: 'Toll Charges Loaded',
                        message: `Found ${tollItems.length} toll charges for this submission`
                    });
                } else {
                    console.log('ℹ️ No toll charges found for trip, keeping basic view');
                }
                
            } catch (error) {
                console.error('❌ Error loading trip toll charges:', error);
                // Don't show error notification as basic submission view is already displayed
                console.log('📋 Continuing with basic submission view');
            }
        }
        
        function generateInvoicePreview(invoice) {
            const preview = document.getElementById('invoice-preview');
            // Use toll total from trip details if available, otherwise fall back to invoice amount minus processing fee
            const total = (invoice.tripDetails && invoice.tripDetails.tollTotal) 
                ? parseFloat(invoice.tripDetails.tollTotal) 
                : parseFloat(invoice.amount) - parseFloat(invoice.processingFee || 0);
            
            preview.innerHTML = `
                <div class="invoice-header">
                    <div class="invoice-company">
                        <div class="company-name">Submission Details</div>
                        <div class="company-details">
                            Trip: ${invoice.tripId}<br>
                            Guest: ${invoice.guest || 'Unknown Guest'}<br>
                            Vehicle: ${invoice.vehicle || 'N/A'}<br>
                            ${invoice.tripDetails && invoice.tripDetails.startDate ? `Trip Start: ${new Date(invoice.tripDetails.startDate).toLocaleString()}<br>` : ''}
                            ${invoice.tripDetails && invoice.tripDetails.endDate ? `Trip End: ${new Date(invoice.tripDetails.endDate).toLocaleString()}<br>` : ''}
                            Submitted: ${new Date(invoice.issueDate).toLocaleDateString()}
                        </div>
                    </div>
                    <div class="invoice-meta">
                        <div class="invoice-date">
                            Total Amount: $${total.toFixed(2)}
                        </div>
                    </div>
                </div>
                
                <table class="invoice-table">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Date</th>
                            <th style="text-align: right;">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${invoice.items && invoice.items.length > 0 ? 
                            invoice.items.map(item => `
                                <tr>
                                    <td>${item.description || `${item.toll_location || 'Toll Charge'} - ${item.plate_number || invoice.vehicle || ''}`}</td>
                                    <td>${item.toll_date ? new Date(item.toll_date).toLocaleDateString() : 'N/A'}</td>
                                    <td style="text-align: right;">$${parseFloat(item.amount || 0).toFixed(2)}</td>
                                </tr>
                            `).join('') 
                        : `
                            <tr>
                                <td>Toll Charges for Trip #${invoice.tripId}</td>
                                <td>${new Date(invoice.issueDate).toLocaleDateString()}</td>
                                <td style="text-align: right;">$${total.toFixed(2)}</td>
                            </tr>
                        `}
                    </tbody>
                </table>
                
                <div class="invoice-totals">
                    <div class="total-row final">
                        <span>Total:</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                </div>
                
                <div class="invoice-notes">
                    <div class="notes-title">Submission Notes:</div>
                    <div class="notes-text">
                        These toll charges were submitted to Turo for collection from the guest. Turo handles all payment processing and collection. Tolls are automatically detected and calculated based on the trip route. The guest will be charged through Turo's platform.
                    </div>
                </div>
            `;
        }
        
        
        async function unsubmitTrip(invoiceId, tripId) {
            if (!confirm(`Are you sure you want to unsubmit trip #${tripId}? This will delete the invoice and move the trip back to the trips page.`)) {
                return;
            }
            
            try {
                showNotification({
                    type: 'info',
                    title: 'Unsubmitting Trip',
                    message: `Reversing submission for trip #${tripId}...`
                });
                
                const response = await fetch(`/api/invoices/${invoiceId}/unsubmit`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuthHeaders()
                    }
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    showNotification({
                        type: 'success',
                        title: 'Trip Unsubmitted',
                        message: `Trip #${result.trip.turoTripId} has been moved back to the trips page.`
                    });
                    
                    // Refresh the invoices data to remove the unsubmitted invoice
                    await loadInvoices();
                } else {
                    showNotification({
                        type: 'error',
                        title: 'Unsubmit Failed',
                        message: result.error || 'Failed to unsubmit trip'
                    });
                }
            } catch (error) {
                console.error('❌ Error unsubmitting trip:', error);
                showNotification({
                    type: 'error',
                    title: 'Error',
                    message: 'An error occurred while unsubmitting the trip'
                });
            }
        }
        
        function showModal() {
            document.getElementById('invoice-modal').classList.add('show');
        }
        
        function hideModal() {
            document.getElementById('invoice-modal').classList.remove('show');
            currentInvoice = null;
        }
        
        function bulkActions() {
            showNotification({
                type: 'info',
                title: 'Bulk Actions',
                message: 'Bulk operation tools coming soon'
            });
        }
        
        
        function refreshData() {
            showNotification({
                type: 'success',
                title: 'Data Refreshed',
                message: 'Invoice data has been updated'
            });
            loadInvoices();
        }
        
        function updateInvoiceStats() {
            const totalInvoices = invoicesData.length;
            const totalRevenue = invoicesData.reduce((sum, inv) => sum + ((inv.amount || 0) - (inv.processingFee || 0)), 0);
            
            updateEl('total-invoices', totalInvoices);
            updateEl('total-revenue', `$${totalRevenue.toFixed(2)}`);
        }
        
        
        // Close modal when clicking outside
        document.getElementById('invoice-modal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                hideModal();
            }
        });
        
        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('invoice-modal').classList.contains('show')) {
                hideModal();
            }
        });
    </script>
    
    <!-- Logout functionality -->
    <script>
        // User menu dropdown functionality
        const userMenu = document.getElementById('userMenu');
        const userDropdown = document.getElementById('userDropdown');
        const signOutBtn = document.getElementById('signOutBtn');
        
        if (userMenu && userDropdown) {
            // Toggle dropdown on user menu click
            userMenu.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                // Check if click is outside both the user menu button and dropdown
                if (!userMenu.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.classList.remove('show');
                }
            });
            
            // Handle sign out
            if (signOutBtn) {
                signOutBtn.addEventListener('click', handleSignOut);
            }
        }
        
        // Sign out function
        async function handleSignOut() {
            
            const signOutBtn = document.getElementById('signOutBtn');
            const userDropdown = document.getElementById('userDropdown');
            
            try {
                // Show loading state
                const originalText = signOutBtn.innerHTML;
                signOutBtn.innerHTML = '<span class="dropdown-icon">⏳</span>Signing out...';
                signOutBtn.disabled = true;
                
                // Clear stored tokens
                localStorage.removeItem('supabase_token');
                localStorage.removeItem('supabase_session');
                
                // Call logout endpoint
                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    console.log('✅ Logout successful');
                    window.location.href = '/';
                } else {
                    console.error('❌ Logout failed');
                    // Still redirect on failure as tokens are cleared
                    window.location.href = '/';
                }
                
            } catch (error) {
                console.error('❌ Logout error:', error);
                // Still redirect on error as tokens are cleared
                window.location.href = '/';
            }
        }
    </script>
    
    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
